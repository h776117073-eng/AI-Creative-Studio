name: Cross-check missing-line donor with ECAPA speaker embeddings

on:
  push:
    branches: [automation/arabic-dub-colab-recovery-20261101]
    paths:
      - ".github/workflows/arabic-dub-ecapa-donor-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecapa-speaker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Colab CLI
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip google-colab-cli
          colab version
      - name: Configure Colab credentials locally only
        env:
          COLAB_CREDENTIALS: ${{ secrets.COLAB_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/gcloud" output
          python - <<'PY'
          import json,os,pathlib
          obj=json.loads(os.environ["COLAB_CREDENTIALS"])
          p=pathlib.Path.home()/".config/gcloud/application_default_credentials.json"
          p.write_text(os.environ["COLAB_CREDENTIALS"],encoding="utf-8");p.chmod(0o600)
          with open(os.environ["GITHUB_ENV"],"a") as f:f.write(f"GOOGLE_APPLICATION_CREDENTIALS={p}\n")
          print("Credential configured locally; value withheld.")
          PY
      - name: Allocate standard T4
        run: |
          set -euo pipefail
          echo "SESSION=arabic-dub-ecapa-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          colab --auth=adc new -s "arabic-dub-ecapa-${GITHUB_RUN_ID}" --gpu T4 2>&1 | tee output/session.log
          colab --auth=adc status -s "arabic-dub-ecapa-${GITHUB_RUN_ID}" | tee output/runtime.txt
          grep -Eqi 'Hardware: T4|gpu-t4' output/runtime.txt
      - name: Compare donor with original speaker using ECAPA
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cat > output/ecapa_check.py <<'PY'
          import subprocess,sys,json
          from pathlib import Path
          ROOT=Path("/content/arabic_dub_ecapa");ROOT.mkdir(parents=True,exist_ok=True)
          MP4=ROOT/"alternate.mp4";WAV=ROOT/"achird.wav"
          def run(c):
              p=subprocess.run(c,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=1800)
              if p.returncode:raise RuntimeError(p.stdout[-3000:])
              return p.stdout
          import torch
          if not torch.cuda.is_available() or "T4" not in torch.cuda.get_device_name(0).upper():raise RuntimeError("T4 required")
          subprocess.run([sys.executable,"-m","pip","install","-q","gdown","soundfile","speechbrain==1.0.3"],check=True)
          import gdown,numpy as np,soundfile as sf
          for path,fid,size in [(MP4,"1TjyE6CuhxxU0iGZDOE3x3S_mnxmiEqlX",920467672),(WAV,"1n-E4VaPurnlbvaT5V_5taMXNHaGC8Ipl",14792144)]:
              if not path.exists() or path.stat().st_size!=size:
                  if not gdown.download(id=fid,output=str(path),quiet=False,resume=True) or path.stat().st_size!=size:raise RuntimeError("Source size mismatch: "+path.name)
          clips={
            "candidate_cartier_108":(MP4,108.1,115.6),
            "candidate_cartier_repeat_2188":(MP4,2187.7,2193.0),
            "achird_chased_reference":(WAV,39.0,43.2),
            "achird_blacklist_reference":(WAV,142.7,155.8)
          }
          paths={}
          for n,(src,a,b) in clips.items():
              out=ROOT/(n+".wav")
              run(["ffmpeg","-y","-hide_banner","-loglevel","error","-ss",str(a),"-i",str(src),"-t",str(b-a),"-vn","-ac","1","-ar","16000","-c:a","pcm_s16le",str(out)])
              paths[n]=out
          # Torchaudio 2.9+ removed list_audio_backends; SpeechBrain 1.0.3 still probes it.
          import torchaudio
          if not hasattr(torchaudio,"list_audio_backends"):
              torchaudio.list_audio_backends=lambda: ["soundfile"]
          from speechbrain.inference.speaker import EncoderClassifier
          model=EncoderClassifier.from_hparams(source="speechbrain/spkrec-ecapa-voxceleb",savedir=str(ROOT/"ecapa"),run_opts={"device":"cuda"})
          em={}
          for n,p in paths.items():
              x,sr=sf.read(str(p),dtype="float32")
              if x.ndim>1:x=x.mean(axis=1)
              t=torch.tensor(x).unsqueeze(0).to("cuda")
              with torch.no_grad(): em[n]=model.encode_batch(t).squeeze().detach().cpu().numpy()
              print("EMBEDDED",n,len(x)/sr,flush=True)
          def cos(a,b):return float(np.dot(a,b)/(np.linalg.norm(a)*np.linalg.norm(b)+1e-12))
          refs=["achird_chased_reference","achird_blacklist_reference"]
          centroid=(em[refs[0]]+em[refs[1]])/2
          report={
           "status":"ecapa_similarity_probe_complete",
           "candidate_108_vs_chased":cos(em["candidate_cartier_108"],em[refs[0]]),
           "candidate_108_vs_blacklist":cos(em["candidate_cartier_108"],em[refs[1]]),
           "candidate_108_vs_centroid":cos(em["candidate_cartier_108"],centroid),
           "candidate_2188_vs_centroid":cos(em["candidate_cartier_repeat_2188"],centroid),
           "reference_pair_similarity":cos(em[refs[0]],em[refs[1]]),
           "note":"Embedding similarity is a screening signal only; it does not prove speaker identity. No donor audio was inserted."
          }
          (ROOT/"ecapa_report.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print("ECAPA_REPORT="+json.dumps(report),flush=True)
          PY
          colab --auth=adc upload -s "$SESSION" output/ecapa_check.py /content/ecapa_check.py
          colab --auth=adc exec -s "$SESSION" --timeout 7200 -f output/ecapa_check.py 2>&1 | tee output/ecapa_check.log
      - name: Retrieve report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p output/return
          colab --auth=adc download -s "$SESSION" /content/arabic_dub_ecapa/ecapa_report.json output/return/ecapa_report.json || true
      - name: Stop T4
        if: always()
        continue-on-error: true
        run: colab --auth=adc stop -s "$SESSION" || true
      - name: Require report
        if: always()
        run: test -s output/return/ecapa_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arabic-dub-ecapa-check-${{ github.run_id }}
          path: output/**
          if-no-files-found: warn
          retention-days: 7
