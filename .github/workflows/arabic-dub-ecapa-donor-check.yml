name: Cross-check missing-line donor with ECAPA speaker embeddings

on:
  push:
    branches: [automation/arabic-dub-colab-recovery-20261101]
    paths:
      - ".github/workflows/arabic-dub-ecapa-donor-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecapa-speaker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Colab CLI
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip google-colab-cli
          colab version
      - name: Configure Colab credentials locally only
        env:
          COLAB_CREDENTIALS: ${{ secrets.COLAB_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/gcloud" output
          python - <<'PY'
          import json,os,pathlib
          obj=json.loads(os.environ["COLAB_CREDENTIALS"])
          p=pathlib.Path.home()/".config/gcloud/application_default_credentials.json"
          p.write_text(os.environ["COLAB_CREDENTIALS"],encoding="utf-8");p.chmod(0o600)
          with open(os.environ["GITHUB_ENV"],"a") as f:f.write(f"GOOGLE_APPLICATION_CREDENTIALS={p}\n")
          print("Credential configured locally; value withheld.")
          PY
      - name: Allocate standard T4
        run: |
          set -euo pipefail
          echo "SESSION=arabic-dub-ecapa-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          colab --auth=adc new -s "arabic-dub-ecapa-${GITHUB_RUN_ID}" --gpu T4 2>&1 | tee output/session.log
          colab --auth=adc status -s "arabic-dub-ecapa-${GITHUB_RUN_ID}" | tee output/runtime.txt
          grep -Eqi 'Hardware: T4|gpu-t4' output/runtime.txt
      - name: Compare donor with original speaker using ECAPA
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cat > output/ecapa_check.py <<'PY'
          import json,os,subprocess,sys,zipfile,math
          from pathlib import Path
          ROOT=Path("/content/arabic_dub_ecapa"); ROOT.mkdir(parents=True,exist_ok=True)
          MP4=ROOT/"alternate.mp4"; ARCHIVE=ROOT/"voice_archive.zip"
          VOICE_FILES={
           "01_Leda":("1mrtadf_yTJtk9vv2OIEqCSyhi-O_VJjA",17743026,"01_Leda.wav"),
           "02_Achird":("1n-E4VaPurnlbvaT5V_5taMXNHaGC8Ipl",14792144,"02_Achird.wav"),
           "03_Kore":("10cFLVZkb79xhYlBIYatBn_6s2hOjc4Os",13408692,"03_Kore.wav"),
           "04_Fu":("1ZGttKXDYt6lzCtcCYU_2qr84ZgPXHDJq",6129236,"04_Fu.wav"),
           "05_Zephyr":("11HSnZ57lpUBlvztteIXF58FLydtJOD_J",7190128,"05_Zephyr.wav")
          }
          ARCHIVE_ID="1kW388RgJNpoVCFEE8HRU18x4sX250bBf"; ARCHIVE_BYTES=38683364
          VIDEO_ID="1TjyE6CuhxxU0iGZDOE3x3S_mnxmiEqlX"; VIDEO_BYTES=920467672
          ARCHIVED={
           "06_Fenrir":("final/06_لي_هواي_شين_Fenrir.wav",9554276),
           "07_Aoede":("final/07_والدة_لي_يانغ_Aoede.wav",4479716),
           "08_Charon":("final/08_لو_تشن_هونغ_Charon.wav",11929316),
           "09_Callirrhoe":("final/09_الأدوار_النسائية_الثانوية_Callirrhoe.wav",6157796),
           "10_Iapetus":("final/10_الأدوار_الرجالية_الثانوية_Iapetus.wav",6559076)
          }
          def run(cmd,timeout=1800):
           p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=timeout)
           if p.returncode: raise RuntimeError(p.stdout[-4000:])
           return p.stdout
          import torch
          if not torch.cuda.is_available() or "T4" not in torch.cuda.get_device_name(0).upper(): raise RuntimeError("Expected Tesla T4")
          subprocess.run([sys.executable,"-m","pip","install","-q","gdown","soundfile","scipy","speechbrain==1.0.3"],check=True)
          import gdown,numpy as np,soundfile as sf
          def download(fid,dest,expected):
           if dest.is_file() and dest.stat().st_size==expected: return
           got=gdown.download(id=fid,output=str(dest),quiet=False,resume=True)
           if not got or not dest.is_file() or dest.stat().st_size!=expected: raise RuntimeError("Download size mismatch: "+dest.name)
          download(VIDEO_ID,MP4,VIDEO_BYTES); download(ARCHIVE_ID,ARCHIVE,ARCHIVE_BYTES)
          archive_dir=ROOT/"archive"; archive_dir.mkdir(exist_ok=True)
          with zipfile.ZipFile(ARCHIVE) as z: z.extractall(archive_dir)
          voices={}
          for label,(fid,size,name) in VOICE_FILES.items():
           p=ROOT/name; download(fid,p,size); voices[label]=p
          for label,(rel,size) in ARCHIVED.items():
           p=archive_dir/rel
           if not p.is_file() or p.stat().st_size!=size: raise RuntimeError("Archived voice master mismatch: "+label)
           voices[label]=p
          candidates={"cartier_108s":(108.1,7.5),"cartier_2188s":(2187.7,6.0)}
          candidate_paths={}
          for name,(start,dur) in candidates.items():
           p=ROOT/(name+".wav")
           run(["ffmpeg","-y","-hide_banner","-loglevel","error","-ss",str(start),"-i",str(MP4),"-t",str(dur),"-vn","-ac","1","-ar","16000","-c:a","pcm_s16le",str(p)])
           candidate_paths[name]=p
          # Runtime compatibility: Torchaudio 2.9 removed list_audio_backends.
          import torchaudio
          if not hasattr(torchaudio,"list_audio_backends"): torchaudio.list_audio_backends=lambda: ["soundfile"]
          # SpeechBrain 1.0.3 still passes use_auth_token; Hub 1.x renamed it to token.
          import huggingface_hub
          _hf_download=huggingface_hub.hf_hub_download
          def _hub_download_compat(*args,**kwargs):
              if "use_auth_token" in kwargs: kwargs["token"]=kwargs.pop("use_auth_token")
              kwargs.pop("resume_download",None)
              kwargs.pop("local_dir_use_symlinks",None)
              kwargs.pop("force_filename",None)
              return _hf_download(*args,**kwargs)
          huggingface_hub.hf_hub_download=_hub_download_compat
          # Hub 1.x raises HfHubHTTPError for an absent optional custom.py;
          # SpeechBrain 1.0.3 only catches requests.HTTPError.
          import speechbrain.utils.fetching as _sb_fetching
          from huggingface_hub.errors import HfHubHTTPError
          _sb_fetching.HTTPError=(_sb_fetching.HTTPError,HfHubHTTPError)
          from speechbrain.inference.speaker import EncoderClassifier
          model=EncoderClassifier.from_hparams(source="speechbrain/spkrec-ecapa-voxceleb",savedir=str(ROOT/"ecapa"),run_opts={"device":"cuda"})
          from scipy.signal import resample_poly
          def mono16(path):
           x,sr=sf.read(str(path),dtype="float32",always_2d=False)
           if x.ndim>1: x=x.mean(axis=1)
           if sr!=16000:
            g=math.gcd(int(sr),16000); x=resample_poly(x,16000//g,int(sr)//g).astype("float32")
           return x
          def embed(x):
           t=torch.from_numpy(np.asarray(x,dtype="float32")).unsqueeze(0).to("cuda")
           with torch.inference_mode(): e=model.encode_batch(t).squeeze().detach().cpu().numpy()
           return e/(np.linalg.norm(e)+1e-12)
          ref_emb={}; ref_counts={}
          for label,path in voices.items():
           x=mono16(path); em=[]
           # Multiple clean 4-second windows; skip silence and cap compute per speaker.
           for start in range(0,max(1,len(x)-64000),96000):
            seg=x[start:min(len(x),start+64000)]
            if len(seg)<48000: continue
            if float(np.sqrt(np.mean(seg*seg)))<0.006: continue
            em.append(embed(seg))
            if len(em)>=24: break
           if not em: raise RuntimeError("No speech windows found in "+label)
           mean=np.mean(np.stack(em),axis=0); ref_emb[label]=mean/(np.linalg.norm(mean)+1e-12); ref_counts[label]=len(em)
           print("REFERENCE_ECAPA",label,"windows",len(em),flush=True)
          report={"status":"ecapa_all_speakers_complete","gpu":torch.cuda.get_device_name(0),"reference_windows":ref_counts,"candidates":{},"method":"SpeechBrain ECAPA-TDNN cosine screening against all ten supplied voice masters; screening only, not proof of identity. No donor audio inserted."}
          for cname,path in candidate_paths.items():
           e=embed(mono16(path))
           scores=sorted([(float(np.dot(e,v)),name) for name,v in ref_emb.items()],reverse=True)
           report["candidates"][cname]={"duration_seconds":float(len(mono16(path))/16000),"top_matches":[{"speaker":name,"cosine":score} for score,name in scores],"top_margin":float(scores[0][0]-scores[1][0])}
          report["same_top_speaker_for_both_candidates"]=report["candidates"]["cartier_108s"]["top_matches"][0]["speaker"]==report["candidates"]["cartier_2188s"]["top_matches"][0]["speaker"]
          (ROOT/"ecapa_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("ECAPA_REPORT="+json.dumps(report,ensure_ascii=False),flush=True)
          PY
          colab --auth=adc upload -s "$SESSION" output/ecapa_check.py /content/ecapa_check.py
          colab --auth=adc exec -s "$SESSION" --timeout 7200 -f output/ecapa_check.py 2>&1 | tee output/ecapa_check.log
      - name: Retrieve report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p output/return
          colab --auth=adc download -s "$SESSION" /content/arabic_dub_ecapa/ecapa_report.json output/return/ecapa_report.json || true
      - name: Stop T4
        if: always()
        continue-on-error: true
        run: colab --auth=adc stop -s "$SESSION" || true
      - name: Require report
        if: always()
        run: test -s output/return/ecapa_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arabic-dub-ecapa-check-${{ github.run_id }}
          path: output/**
          if-no-files-found: warn
          retention-days: 7
