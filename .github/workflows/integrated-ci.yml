name: integrated-mvp-ci

on:
  push:
    branches: [main, integration-mvp-1]
  pull_request:

permissions:
  contents: read

jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build timeline engine
        run: npm run build -w @ai-creative-studio/timeline-engine
      - name: Run timeline interaction self test
        run: npm run test:self -w @ai-creative-studio/timeline-engine

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm install
      - name: Build API
        run: npm run build:api
      - name: API regression
        run: npm run test:api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web
        run: npm run build:apps

  full-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm install
      - name: Build every TypeScript workspace
        run: npm run build:engines
      - name: Build full repository
        run: npm run build
      - name: Run API media regression
        run: npm run test:api
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  android:
    name: Android APK + emulator product verification
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute final Android validation runner
        run: |
          chmod +x tools/android/run_final_validation.sh
          tools/android/run_final_validation.sh
      - name: Upload final Android APK and UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: vireon-final-android-validation
          path: |
            android-build/AI-Creative-Studio-debug.apk
            android-build/vireon-ar.png
            android-build/vireon-en.png
            android-build/vireon-ar.xml
            android-build/settings.xml
            android-build/en.xml
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vireon-final-android-test-reports
          path: |
            android-build/clearcut/app/build/reports/tests/testQaUnitTest/**
            android-build/clearcut/app/build/test-results/testQaUnitTest/**
          if-no-files-found: ignore
          retention-days: 14
