name: integrated-mvp-ci

on:
  push:
    branches: [main, integration-mvp-1]
  pull_request:

permissions:
  contents: read

jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build timeline engine
        run: npm run build -w @ai-creative-studio/timeline-engine
      - name: Run timeline interaction self test
        run: npm run test:self -w @ai-creative-studio/timeline-engine

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm install
      - name: Build API
        run: npm run build:api
      - name: API regression
        run: npm run test:api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web
        run: npm run build:apps

  full-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm install
      - name: Build every TypeScript workspace
        run: npm run build:engines
      - name: Build full repository
        run: npm run build
      - name: Run API media regression
        run: npm run test:api
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  android:
    uses: ./.github/workflows/android-apk.yml
