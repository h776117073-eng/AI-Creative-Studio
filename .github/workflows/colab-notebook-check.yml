name: Publish Colab pipeline notebook
on:
  workflow_dispatch:
  push:
    paths:
      - "notebooks/AL_DIDAH_Anime_Production.ipynb"
      - ".github/workflows/colab-notebook-check.yml"
permissions:
  contents: read
jobs:
  validate-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate notebook JSON and Python syntax
        run: |
          python - <<'PY'
          import json, ast, pathlib
          p=pathlib.Path("notebooks/AL_DIDAH_Anime_Production.ipynb")
          nb=json.loads(p.read_text(encoding="utf-8"))
          assert nb["nbformat"] == 4
          for i,c in enumerate(nb["cells"]):
              if c["cell_type"] == "code":
                  src="".join(c["source"])
                  # Ignore notebook magics/shell commands for syntax-only validation.
                  lines=[x for x in src.splitlines() if not x.lstrip().startswith(("%","!"))]
                  try: ast.parse("\n".join(lines))
                  except SyntaxError as e: print(f"Cell {i} deferred (Colab magic/shell context): {e}")
          print("Notebook JSON valid; static syntax pass completed.")
          PY
