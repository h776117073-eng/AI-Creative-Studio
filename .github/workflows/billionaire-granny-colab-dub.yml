name: Billionaire Granny — Arabic multi-speaker dubbing on Colab

on:
  workflow_dispatch:
    inputs:
      rights_confirmed:
        description: "Confirm authorization to create and store a full dubbed derivative"
        required: true
        type: choice
        options: ["no", "yes"]
        default: "yes"
      asr_model:
        description: "Speech recognition model"
        required: true
        type: choice
        options: ["base", "small"]
        default: "small"
      translation_backend:
        description: "Arabic translation backend"
        required: true
        type: choice
        options: ["google", "argos"]
        default: "google"
      high_mem:
        description: "Require a high-RAM Colab runtime; do not fall back to standard RAM"
        required: true
        type: boolean
        default: true

  push:
    branches: [main]
    paths:
      - "scripts/dub_billionaire_granny.py"
      - "scripts/dub_arabic_multispeaker.py"
      - "scripts/dub_arabic_cpu.py"
      - ".github/workflows/billionaire-granny-colab-dub.yml"

permissions:
  contents: read

concurrency:
  group: billionaire-granny-colab-dubbing
  cancel-in-progress: false

jobs:
  dub-on-colab:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.rights_confirmed == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out pipeline
        uses: actions/checkout@v4

      - name: Set up Python 3.12 and Node.js 20
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install official Colab CLI and Drive API client
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade google-colab-cli google-api-python-client google-auth google-auth-httplib2
          colab --help

      - name: Configure ADC credentials without printing the secret
        env:
          COLAB_CREDENTIALS: ${{ secrets.COLAB_CREDENTIALS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/gcloud" output
          if [ -z "${COLAB_CREDENTIALS:-}" ]; then
            echo "::error::GitHub Actions secret COLAB_CREDENTIALS is missing or empty."
            echo "Credential setup was not possible." > output/colab_dub.log
            exit 1
          fi
          python - <<'PY'
          import json, os, pathlib, sys
          raw = os.environ.get("COLAB_CREDENTIALS", "")
          try:
              parsed = json.loads(raw)
              if not isinstance(parsed, dict):
                  raise ValueError("JSON root must be an object")
              credential_type = parsed.get("type")
              if credential_type not in {"authorized_user", "service_account", "external_account", "impersonated_service_account"}:
                  raise ValueError("Unsupported Google ADC credential type")
              target = pathlib.Path.home() / ".config/gcloud/application_default_credentials.json"
              target.write_text(raw, encoding="utf-8")
              target.chmod(0o600)
          except Exception as exc:
              pathlib.Path("output/colab_dub.log").write_text(
                  f"Credential setup failed: {type(exc).__name__}: {exc}\n", encoding="utf-8")
              print("::error::COLAB_CREDENTIALS is not supported Google ADC JSON; the secret was not printed.")
              sys.exit(1)
          print(f"Google ADC credential JSON validated (type={credential_type}); secret content not printed.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"GOOGLE_APPLICATION_CREDENTIALS={target}\n")
          PY

      - name: Validate Drive API access and prepare persistent output folders
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          from google.auth import load_credentials_from_file
          from googleapiclient.discovery import build

          source_id = "1sMis6qi_j3AsBvAEL2mliPRIKf0s3-uI"
          source_folder_id = "1Ux4dAzND0LeOOygUCldHf-QO3agMgcCy"
          expected_name = "Billionaire Granny Takes Home Fainted Pregnant Woman - Original Quality.mkv"
          credentials_path = os.environ["GOOGLE_APPLICATION_CREDENTIALS"]
          # Do not request additional OAuth scopes here. Reuse the existing user-granted ADC scope set.
          credentials, _ = load_credentials_from_file(credentials_path)
          drive = build("drive", "v3", credentials=credentials, cache_discovery=False)

          source = drive.files().get(
              fileId=source_id,
              fields="id,name,size,mimeType,modifiedTime,md5Checksum,parents,trashed",
              supportsAllDrives=True,
          ).execute(num_retries=4)
          if source.get("name") != expected_name or source.get("trashed"):
              raise SystemExit("Drive source ID did not resolve to the expected live video.")
          if int(source.get("size") or 0) < 1_000_000_000:
              raise SystemExit("Drive source size is too small; refusing to process a partial/wrong file.")
          if source_folder_id not in source.get("parents", []):
              raise SystemExit("The source video is no longer inside the expected Drive folder.")

          parent = drive.files().get(
              fileId=source_folder_id, fields="id,name,mimeType,capabilities", supportsAllDrives=True
          ).execute(num_retries=4)
          if parent.get("name") != "دبلجة" or parent.get("mimeType") != "application/vnd.google-apps.folder":
              raise SystemExit("The expected Drive parent folder could not be verified.")

          def find_or_create_folder(name, parent_id):
              q = (
                  f"name = '{name}' and '{parent_id}' in parents "
                  "and mimeType = 'application/vnd.google-apps.folder' and trashed = false"
              )
              response = drive.files().list(
                  q=q, pageSize=20, fields="files(id,name,parents)",
                  supportsAllDrives=True, includeItemsFromAllDrives=True,
              ).execute(num_retries=4)
              matches = response.get("files", [])
              if matches:
                  return matches[0]["id"]
              created = drive.files().create(
                  body={"name": name, "mimeType": "application/vnd.google-apps.folder", "parents": [parent_id]},
                  fields="id,name,parents", supportsAllDrives=True,
              ).execute(num_retries=4)
              return created["id"]

          output_id = find_or_create_folder("Billionaire_Granny_Arabic_Dub", source_folder_id)
          checkpoint_id = find_or_create_folder("checkpoints", output_id)
          # Confirm that the Drive API credential can write in the chosen location.
          output_meta = drive.files().get(fileId=output_id, fields="id,name,mimeType,parents", supportsAllDrives=True).execute()
          checkpoint_meta = drive.files().get(fileId=checkpoint_id, fields="id,name,mimeType,parents", supportsAllDrives=True).execute()
          if output_id not in checkpoint_meta.get("parents", []):
              raise SystemExit("Checkpoint folder is not nested under the output folder.")
          print(json.dumps({
              "source_name": source["name"],
              "source_size_bytes": int(source["size"]),
              "source_modified_time": source.get("modifiedTime"),
              "drive_parent_folder": parent["name"],
              "output_folder": output_meta["name"],
              "drive_api_access": "verified",
          }, ensure_ascii=False))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"DRIVE_SOURCE_FOLDER_ID={source_folder_id}\n")
              env_file.write(f"DRIVE_OUTPUT_FOLDER_ID={output_id}\n")
              env_file.write(f"DRIVE_CHECKPOINT_FOLDER_ID={checkpoint_id}\n")
          PY

      - name: Prepare remote task configuration
        env:
          ASR_MODEL_INPUT: ${{ inputs.asr_model || 'small' }}
          TRANSLATION_BACKEND_INPUT: ${{ inputs.translation_backend || 'google' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          with open("output/dub_config.json", "w", encoding="utf-8") as f:
              json.dump({
                  "source_file_id": "1sMis6qi_j3AsBvAEL2mliPRIKf0s3-uI",
                  "source_folder_id": os.environ["DRIVE_SOURCE_FOLDER_ID"],
                  "output_folder_id": os.environ["DRIVE_OUTPUT_FOLDER_ID"],
                  "checkpoint_folder_id": os.environ["DRIVE_CHECKPOINT_FOLDER_ID"],
                  "asr_model": os.environ.get("ASR_MODEL_INPUT") or "small",
                  "translation_backend": os.environ.get("TRANSLATION_BACKEND_INPUT") or "google",
              }, f, ensure_ascii=False, indent=2)
          print("Task config prepared; it contains Drive IDs and runtime options, not credentials.")
          PY

      - name: Create high-RAM Colab session and execute resumable dubbing
        timeout-minutes: 345
        env:
          HIGH_MEM: ${{ inputs.high_mem || 'true' }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        shell: bash
        run: |
          set -euo pipefail
          SESSION="billionaire-granny-dub"
          mkdir -p output
          : > output/colab_dub.log

          cleanup() {
            echo "Stopping Colab session $SESSION to release compute resources." | tee -a output/colab_dub.log
            colab --auth=adc stop -s "$SESSION" >> output/colab_dub.log 2>&1 || true
          }
          trap cleanup EXIT

          colab --auth=adc stop -s "$SESSION" >> output/colab_dub.log 2>&1 || true
          if [ "$HIGH_MEM" = "true" ]; then
            if ! colab --auth=adc new -s "$SESSION" --high-mem 2>&1 | tee -a output/colab_dub.log; then
              echo "::error::Colab high-RAM session was unavailable. Standard-RAM fallback is deliberately disabled to avoid a RAM crash."
              exit 1
            fi
          else
            colab --auth=adc new -s "$SESSION" 2>&1 | tee -a output/colab_dub.log
          fi

          echo "Installing Google Drive API libraries inside the Colab runtime..." | tee -a output/colab_dub.log
          colab --auth=adc install -s "$SESSION" google-api-python-client google-auth google-auth-httplib2 2>&1 | tee -a output/colab_dub.log

          echo "Preparing a private temporary credential directory on the ephemeral Colab VM..." | tee -a output/colab_dub.log
          printf 'from pathlib import Path; Path("/content/.private").mkdir(parents=True, exist_ok=True)\n' | colab --auth=adc exec -s "$SESSION" 2>&1 | tee -a output/colab_dub.log

          echo "Transferring the ADC file to the ephemeral Colab VM (its contents will not be printed)..." | tee -a output/colab_dub.log
          colab --auth=adc upload -s "$SESSION" "$GOOGLE_APPLICATION_CREDENTIALS" /content/.private/google_adc.json 2>&1 | tee -a output/colab_dub.log
          colab --auth=adc upload -s "$SESSION" output/dub_config.json /content/dub_config.json 2>&1 | tee -a output/colab_dub.log
          colab --auth=adc status -s "$SESSION" 2>&1 | tee output/colab_runtime_status.txt

          echo "Running Drive-API-backed, resumable multi-speaker Arabic dubbing. No interactive Drive mount is used." | tee -a output/colab_dub.log
          colab --auth=adc exec -s "$SESSION" -f scripts/dub_billionaire_granny.py 2>&1 | tee -a output/colab_dub.log

      - name: Retrieve verified Colab outputs back into GitHub Actions
        if: always()
        timeout-minutes: 45
        shell: bash
        run: |
          set +e
          mkdir -p output/colab_return
          SESSION="billionaire-granny-dub"
          download_one() {
            remote="$1"
            local="$2"
            echo "Retrieving Colab output: $remote"
            if colab --auth=adc download -s "$SESSION" "$remote" "$local" >> output/colab_dub.log 2>&1; then
              if [ -f "$local" ]; then
                echo "Retrieved $(basename "$local"): $(stat -c%s "$local") bytes"
                return 0
              fi
            fi
            echo "Not available from Colab VM: $remote"
            return 1
          }
          download_one "/content/Billionaire_Granny_Arabic_Dub_final.mp4" "output/colab_return/Billionaire_Granny_Arabic_Dub_final.mp4" || true
          download_one "/content/Billionaire_Granny_Arabic_Dub/quality_report.json" "output/colab_return/quality_report.json" || true
          download_one "/content/Billionaire_Granny_Arabic_Dub/progress.json" "output/colab_return/progress.json" || true
          download_one "/content/Billionaire_Granny_Arabic_Dub/progress.log" "output/colab_return/progress.log" || true
          download_one "/content/Billionaire_Granny_Arabic_Dub/Arabic_Dub_Subtitles.srt" "output/colab_return/Arabic_Dub_Subtitles.srt" || true
          if [ -f output/colab_return/quality_report.json ]; then
            echo "========== Retrieved Colab quality report =========="
            cat output/colab_return/quality_report.json
          fi
          if [ -f output/colab_return/progress.json ]; then
            echo "========== Retrieved Colab progress =========="
            cat output/colab_return/progress.json
          fi
          echo "Colab-to-GitHub transfer phase completed; missing files are reported above."

      - name: Stop any remaining Colab session
        if: always()
        continue-on-error: true
        run: colab --auth=adc stop -s billionaire-granny-dub || true

      - name: Upload workflow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billionaire-granny-colab-dub-${{ github.run_id }}
          path: |
            output/colab_dub.log
            output/colab_runtime_status.txt
            output/dub_config.json
            output/colab_return/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
