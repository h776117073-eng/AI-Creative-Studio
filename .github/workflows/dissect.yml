name: Dissect Android Editor APK — CapCut Architecture Study

on:
  push:
    branches: [main]
    paths:
      - 'tools/capcut-study/**'
      - '.github/workflows/dissect.yml'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct APK/XAPK URL. Leave empty to fetch public CapCut APK.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  self-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate study scripts
        run: |
          python -m py_compile tools/capcut-study/fetch_apk.py
          python -m py_compile tools/capcut-study/fast_apk_fingerprint.py
          python -m py_compile tools/capcut-study/select_fingerprint.py
          python -m py_compile tools/capcut-study/dissect_capcut.py
          python -m py_compile tools/capcut-study/dissect_capcut_runner.py
          python -m py_compile tools/capcut-study/compare_vireon.py
      - name: Run deterministic dissector self-test
        run: python tools/capcut-study/dissect_capcut_runner.py --self-test

  analyze:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip binutils file
      - name: Install Apktool 2.9.3
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -o /tmp/apktool.jar
          curl -fsSL --retry 5 --retry-all-errors https://raw.githubusercontent.com/iBotPeaches/Apktool/v2.9.3/scripts/linux/apktool -o /tmp/apktool
          chmod +x /tmp/apktool
          sudo cp /tmp/apktool.jar /usr/local/bin/apktool.jar
          sudo cp /tmp/apktool /usr/local/bin/apktool
          apktool --version
      - name: Install JADX 1.5.6
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /opt/jadx
          unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo ln -sf /opt/jadx/bin/jadx /usr/local/bin/jadx
          jadx --version
      - name: Resolve APK source
        env:
          APK_URL: ${{ github.event.inputs.apk_url }}
        run: |
          set -euo pipefail
          mkdir -p target
          if [ -n "${APK_URL:-}" ]; then
            curl -fL --retry 5 --retry-all-errors --max-time 600 "$APK_URL" -o target/input.apk_or_xapk
          else
            python tools/capcut-study/fetch_apk.py --output target/input.apk_or_xapk --metadata target/capcut_fetch.json
          fi
          file target/input.apk_or_xapk
          test -s target/input.apk_or_xapk
      - name: Execute actual APK/XAPK decompilation
        run: |
          set -euo pipefail
          rm -rf extracted_capcut
          mkdir -p extracted_capcut/apktool_out extracted_capcut/jadx_out
          python - <<'PY'
from pathlib import Path
import shutil, zipfile
src=Path('target/input.apk_or_xapk')
out=Path('target/apks'); out.mkdir(parents=True, exist_ok=True)

def is_apk(p):
    try:
        with zipfile.ZipFile(p) as z:
            return 'AndroidManifest.xml' in z.namelist()
    except zipfile.BadZipFile:
        return False
if is_apk(src):
    shutil.copy2(src, out/'main.apk')
else:
    with zipfile.ZipFile(src) as z:
        found=0
        for i in z.infolist():
            if i.filename.lower().endswith('.apk'):
                dest=out/f'apk_{found}.apk'; dest.parent.mkdir(parents=True,exist_ok=True)
                with z.open(i) as a, dest.open('wb') as b: shutil.copyfileobj(a,b)
                found += 1
        if found == 0: raise SystemExit('No APK members found')
PY
          for apk in target/apks/*.apk; do
            tag=$(basename "$apk" .apk)
            apktool d -f "$apk" -o "extracted_capcut/apktool_out/$tag"
            jadx -d "extracted_capcut/jadx_out/$tag" --no-res --output-format java "$apk"
          done
      - name: Generate deep architecture report without retaining proprietary source in the repository
        run: |
          python - <<'PY'
from pathlib import Path
import hashlib, json, re
from collections import Counter
root=Path('extracted_capcut')
manifest_rows=[]; libs=[]; java_files=[]; term_counts=Counter(); schema=Counter(); shader_files=[]
terms=('timeline','track','clip','segment','keyframe','trim','split','transition','speed','curve','playhead','ripple','render','decoder','encoder','compositor','audio','waveform','media','source')
for p in (root/'apktool_out').glob('*'):
    m=p/'AndroidManifest.xml'
    manifest_rows.append({'apk':p.name,'manifest_exists':m.exists(),'manifest_head':m.read_text(errors='ignore')[:4000] if m.exists() else ''})
    for so in (p/'lib').rglob('*.so') if (p/'lib').exists() else []:
        h=hashlib.sha256(so.read_bytes()).hexdigest(); libs.append({'path':str(so.relative_to(p)),'abi':so.parent.name,'size':so.stat().st_size,'sha256':h})
    for s in p.rglob('*'):
        if s.is_file() and (s.suffix.lower() in {'.glsl','.frag','.vert','.comp','.geom','.spv','.metal','.hlsl'} or 'shader' in s.name.lower()):
            shader_files.append({'path':str(s.relative_to(p)),'size':s.stat().st_size,'sha256':hashlib.sha256(s.read_bytes()).hexdigest()})
    for s in p.rglob('*'):
        if s.is_file() and s.suffix.lower() in {'.json','.json5','.xml','.yaml','.yml','.proto','.toml'}:
            schema[s.suffix.lower()] += 1
for p in (root/'jadx_out').rglob('*.java'):
    text=p.read_text(errors='ignore'); low=text.lower(); hits={t:len(re.findall(r'\b'+re.escape(t)+r'\b',low)) for t in terms}; hits={k:v for k,v in hits.items() if v}
    if hits:
        java_files.append({'path':str(p.relative_to(root/'jadx_out')),'terms':hits})
        term_counts.update(hits)
report={'study':'capcut-architecture-deep-decompile','status':'completed','note':'Decompiled output is analyzed ephemerally in CI; proprietary source/assets are not copied into the Vireon repository or redistributed.','manifest':manifest_rows,'native_libraries':sorted(libs,key=lambda x:x['path']),'shaders':shader_files,'schema_file_counts':dict(schema),'timeline_term_counts':term_counts.most_common(),'candidate_java_files':sorted(java_files,key=lambda x:sum(x['terms'].values()),reverse=True)[:500]}
Path('CAPCUT_DEEP_ARCHITECTURE.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
lines=['# CapCut Deep Architecture Study','','The CI job performed real Apktool resource decoding and JADX DEX→Java decompilation on the fetched APK/XAPK. The resulting source tree is temporary CI material and is not redistributed.','',f"Candidate Java files: **{len(java_files)}**",f"Native libraries: **{len(libs)}**",f"Shader-like assets: **{len(shader_files)}**",'', '## Timeline/media signals','']
lines += [f"- `{k}`: {v}" for k,v in term_counts.most_common()]
lines += ['', '## Vireon implementation implications', '- Normalize source-time/timeline-time mapping.', '- Treat clip/segment/range/keyframe/transition as typed timeline primitives.', '- Separate decode/cache/proxy/render from timeline state.', '- Route AI commands to typed editor operations and transactions, not UI text matching.', '- Keep preview and offline render on the same normalized render graph.']
Path('CAPCUT_DEEP_ARCHITECTURE.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
PY
      - name: Upload deep study artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CapCut-Vireon-Deep-Architecture-Study
          path: |
            CAPCUT_DEEP_ARCHITECTURE.md
            CAPCUT_DEEP_ARCHITECTURE.json
            target/capcut_fetch.json
          if-no-files-found: error
          retention-days: 14
