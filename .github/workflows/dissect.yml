name: Dissect Android Editor APK — Architecture Fingerprint

on:
  push:
    branches: [main]
    paths:
      - 'tools/capcut-study/**'
      - '.github/workflows/dissect.yml'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct APK/XAPK URL. Leave empty to auto-fetch the latest public CapCut APK page.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  self-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate study scripts
        run: |
          python -m py_compile tools/capcut-study/fetch_apk.py
          python -m py_compile tools/capcut-study/dissect_capcut_runner.py
          python -m py_compile tools/capcut-study/compare_vireon.py
      - name: Run deterministic dissector self-test
        run: python tools/capcut-study/dissect_capcut_runner.py --self-test

  analyze:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip binutils file
      - name: Install Apktool 2.9.3
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -o /tmp/apktool.jar
          curl -fsSL --retry 5 --retry-all-errors https://raw.githubusercontent.com/iBotPeaches/Apktool/v2.9.3/scripts/linux/apktool -o /tmp/apktool
          chmod +x /tmp/apktool
          sudo cp /tmp/apktool.jar /usr/local/bin/apktool.jar
          sudo cp /tmp/apktool /usr/local/bin/apktool
          apktool --version
      - name: Install JADX 1.5.6
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          rm -rf /tmp/jadx
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          JADX_BIN="$(find /tmp/jadx -type f -path '*/bin/jadx' -print -quit)"
          test -n "$JADX_BIN"
          JADX_HOME="$(dirname "$(dirname "$JADX_BIN")")"
          test -d "$JADX_HOME/lib"
          "$JADX_HOME/bin/jadx" --version
          sudo rm -rf /opt/jadx
          sudo cp -R "$JADX_HOME" /opt/jadx
          sudo chmod +x /opt/jadx/bin/jadx
          echo 'alias jadx=/opt/jadx/bin/jadx' >> "$HOME/.bash_aliases"
          echo "/opt/jadx/bin" >> "$GITHUB_PATH"
          /opt/jadx/bin/jadx --version
      - name: Resolve APK source
        env:
          APK_URL: ${{ github.event.inputs.apk_url }}
        run: |
          set -euo pipefail
          mkdir -p target
          if [ -n "${APK_URL:-}" ]; then
            echo "[*] Using supplied APK/XAPK URL"
            curl -fL --retry 5 --retry-all-errors --max-time 600 "$APK_URL" -o target/input.apk_or_xapk
          else
            echo "[*] Auto-fetching latest public CapCut APK from configured distribution page"
            python tools/capcut-study/fetch_apk.py --output target/input.apk_or_xapk --metadata target/capcut_fetch.json
          fi
          file target/input.apk_or_xapk
          test -s target/input.apk_or_xapk
      - name: Generate architecture fingerprint
        run: |
          python tools/capcut-study/dissect_capcut_runner.py target/input.apk_or_xapk --output extracted_capcut --report CAPCUT_ARCHITECTURE_REPORT.md
      - name: Compare CapCut fingerprint with Vireon architecture
        run: |
          python tools/capcut-study/compare_vireon.py extracted_capcut/architecture_fingerprint.json --output CAPCUT_VIREON_COMPARISON.md
      - name: Upload architecture study reports
        uses: actions/upload-artifact@v4
        with:
          name: CapCut-Vireon-Architecture-Study
          path: |
            CAPCUT_ARCHITECTURE_REPORT.md
            CAPCUT_VIREON_COMPARISON.md
            extracted_capcut/architecture_fingerprint.json
            target/capcut_fetch.json
          if-no-files-found: error
          retention-days: 14
