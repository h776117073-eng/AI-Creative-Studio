name: Dissect Android Editor APK — Architecture Fingerprint

'on':
  push:
    branches: [main]
    paths:
      - 'tools/capcut-study/**'
      - '.github/workflows/dissect.yml'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct APK/XAPK URL. Leave empty to auto-fetch the latest public CapCut APK page.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate-and-study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate study scripts
        run: |
          python -m py_compile tools/capcut-study/fetch_apk.py
          python -m py_compile tools/capcut-study/dissect_capcut_runner.py
          python -m py_compile tools/capcut-study/compare_vireon.py
          python tools/capcut-study/dissect_capcut_runner.py --self-test

      - name: Install native utilities
        if: ${{ github.event_name != 'push' || github.event_name == 'push' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip binutils file

      - name: Install pinned Apktool 2.9.3
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -o /tmp/apktool.jar
          curl -fsSL --retry 3 --retry-all-errors https://raw.githubusercontent.com/iBotPeaches/Apktool/v2.9.3/scripts/linux/apktool -o /tmp/apktool
          chmod +x /tmp/apktool
          sudo cp /tmp/apktool.jar /usr/local/bin/apktool.jar
          sudo cp /tmp/apktool /usr/local/bin/apktool
          apktool --version

      - name: Install pinned JADX 1.5.0
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          sudo cp /tmp/jadx/jadx-1.5.0/bin/jadx /usr/local/bin/jadx
          sudo chmod +x /usr/local/bin/jadx
          sudo mkdir -p /usr/local/lib/jadx
          sudo cp -R /tmp/jadx/jadx-1.5.0/lib/. /usr/local/lib/jadx/
          jadx --version

      - name: Resolve APK source
        env:
          APK_URL: ${{ github.event.inputs.apk_url }}
        run: |
          set -euo pipefail
          mkdir -p target
          if [ -n "${APK_URL:-}" ]; then
            echo "[*] Using supplied APK/XAPK URL"
            curl -fL --retry 3 --retry-all-errors --max-time 600 "$APK_URL" -o target/input.apk_or_xapk
            printf '%s\n' '{"source":"supplied_url"}' > target/capcut_fetch.json
          else
            echo "[*] Auto-fetching latest public CapCut APK"
            python tools/capcut-study/fetch_apk.py \
              --output target/input.apk_or_xapk \
              --metadata target/capcut_fetch.json
          fi
          file target/input.apk_or_xapk
          test -s target/input.apk_or_xapk

      - name: Generate architecture fingerprint
        run: |
          python tools/capcut-study/dissect_capcut_runner.py target/input.apk_or_xapk \
            --output extracted_capcut \
            --report CAPCUT_ARCHITECTURE_REPORT.md

      - name: Compare CapCut fingerprint with Vireon architecture
        run: |
          python tools/capcut-study/compare_vireon.py \
            extracted_capcut/architecture_fingerprint.json \
            --output CAPCUT_VIREON_COMPARISON.md

      - name: Upload architecture study reports
        uses: actions/upload-artifact@v4
        with:
          name: CapCut-Vireon-Architecture-Study
          path: |
            CAPCUT_ARCHITECTURE_REPORT.md
            CAPCUT_VIREON_COMPARISON.md
            extracted_capcut/architecture_fingerprint.json
            target/capcut_fetch.json
          if-no-files-found: error
          retention-days: 14
