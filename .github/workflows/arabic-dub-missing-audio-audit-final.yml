name: Missing-line audit (CPU-safe ASR)
# Single serialized T4 run; CPU ASR avoids the missing CUDA cublas library in Colab.

on:
  push:
    branches: [automation/arabic-dub-colab-recovery-20261101]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: arabic-dub-colab-exclusive
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check the audit script
        run: python -m py_compile automation/episode_repair_20261101/audit_missing_audio.py

      - uses: actions/download-artifact@v4
        name: Download the completed alternate-MP4 transcript (text only)
        with:
          name: arabic-dub-full-audio-index-41335378127
          run-id: 41335378127
          github-token: ${{ github.token }}
          path: output/evidence/transcript

      - uses: actions/download-artifact@v4
        name: Download the completed alternate-MP4 probe (text only)
        with:
          name: arabic-dub-alternate-mp4-probe-41334011457
          run-id: 41334011457
          github-token: ${{ github.token }}
          path: output/evidence/probe

      - name: Prepare evidence files
        run: |
          set -euo pipefail
          mkdir -p output/evidence/return output/return
          test -s output/evidence/transcript/return/full_transcript.json
          test -s output/evidence/probe/return/probe_report.json
          cp output/evidence/transcript/return/full_transcript.json output/evidence/return/full_transcript.json
          cp output/evidence/probe/return/probe_report.json output/evidence/return/probe_report.json
          python -m json.tool output/evidence/return/full_transcript.json >/dev/null
          python -m json.tool output/evidence/return/probe_report.json >/dev/null

      - name: Install official Colab CLI
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip google-colab-cli
          colab version

      - name: Configure Colab CLI credentials locally only
        env:
          COLAB_CREDENTIALS: ${{ secrets.COLAB_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/gcloud" output
          if [ -z "${COLAB_CREDENTIALS:-}" ]; then
            echo "::error::COLAB_CREDENTIALS is missing."
            exit 1
          fi
          python - <<'PY'
          import json,os,pathlib
          obj=json.loads(os.environ["COLAB_CREDENTIALS"])
          if obj.get("type") not in {"authorized_user","service_account","external_account","impersonated_service_account"}:
              raise SystemExit("Unsupported Colab credential type.")
          p=pathlib.Path.home()/".config/gcloud/application_default_credentials.json"
          p.write_text(os.environ["COLAB_CREDENTIALS"],encoding="utf-8")
          p.chmod(0o600)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write(f"GOOGLE_APPLICATION_CREDENTIALS={p}\n")
          print("Colab CLI credentials configured locally; secret contents withheld.")
          PY

      - name: Check no other T4 session is active
        run: |
          set -euo pipefail
          colab --auth=adc sessions 2>&1 | tee output/sessions_before.txt
          if grep -Eqi 'gpu-t4|Hardware: T4' output/sessions_before.txt; then
            echo "::error::An active T4 session exists; refusing to allocate a competing session."
            exit 1
          fi

      - name: Allocate and verify standard Colab T4
        run: |
          set -euo pipefail
          SESSION="arabic-dub-missing-audit-final-${GITHUB_RUN_ID}"
          echo "SESSION=$SESSION" >> "$GITHUB_ENV"
          colab --auth=adc new -s "$SESSION" --gpu T4 2>&1 | tee output/session.log
          colab --auth=adc status -s "$SESSION" 2>&1 | tee output/runtime.txt
          grep -Eqi 'Hardware: T4|gpu-t4' output/runtime.txt

      - name: Install CPU-safe ASR and audio dependencies in Colab
        run: |
          set -euo pipefail
          cat > output/install_deps.py <<'PY'
          import subprocess,sys
          subprocess.check_call([sys.executable,"-m","pip","install","-q","gdown","faster-whisper","requests","pillow","soundfile"])
          print("AUDIT_DEPENDENCIES_READY")
          PY
          colab --auth=adc exec -s "$SESSION" --timeout 1800 -f output/install_deps.py 2>&1 | tee output/install.log

      - name: Upload audit code and existing transcript evidence
        run: |
          set -euo pipefail
          colab --auth=adc exec -s "$SESSION" --timeout 300 -f <(printf '%s\n' 'from pathlib import Path; Path("/content/evidence/return").mkdir(parents=True,exist_ok=True)')
          colab --auth=adc upload -s "$SESSION" automation/episode_repair_20261101/audit_missing_audio.py /content/audit_missing_audio.py
          colab --auth=adc upload -s "$SESSION" output/evidence/return/full_transcript.json /content/evidence/return/full_transcript.json
          colab --auth=adc upload -s "$SESSION" output/evidence/return/probe_report.json /content/evidence/return/probe_report.json

      - name: Audit all ten original voice masters and source-time candidates
        timeout-minutes: 300
        run: |
          set -euo pipefail
          colab --auth=adc exec -s "$SESSION" --timeout 14400 -f automation/episode_repair_20261101/audit_missing_audio.py 2>&1 | tee output/audit_execution.log

      - name: Retrieve mandatory audit report and optional review bundle
        if: always()
        run: |
          set -euo pipefail
          mkdir -p output/return
          colab --auth=adc download -s "$SESSION" /content/missing_audio_audit/output/missing_audio_audit.json output/return/missing_audio_audit.json
          test -s output/return/missing_audio_audit.json
          colab --auth=adc download -s "$SESSION" /content/missing_audio_audit/output/voice_master_manifest.json output/return/voice_master_manifest.json || true
          colab --auth=adc download -s "$SESSION" /content/missing_audio_audit/output/missing_audio_audit_bundle.zip output/return/missing_audio_audit_bundle.zip || true

      - name: Validate retrieved audit JSON
        if: always()
        run: |
          set -euo pipefail
          test -s output/return/missing_audio_audit.json
          python -m json.tool output/return/missing_audio_audit.json >/dev/null
          echo "AUDIT_JSON=VALID"

      - name: Stop Colab T4 in all outcomes
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${SESSION:-}" ]; then
            colab --auth=adc stop -s "$SESSION" || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arabic-dub-missing-audio-audit-final-${{ github.run_id }}
          path: output/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
