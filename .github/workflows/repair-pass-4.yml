name: Repair Pass 4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified renderer repair
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, transform):
              p = Path(path)
              old = p.read_text(encoding='utf-8')
              new = transform(old)
              p.write_text(new, encoding='utf-8')
              print(f'{path}:', 'changed' if new != old else 'unchanged')

          runner = r'''\nfunction runFFmpeg(args:string[],timeoutMs=180000):Promise<void>{\n  return new Promise((resolve,reject)=>{\n    const child=spawn('ffmpeg',args,{stdio:['ignore','ignore','pipe']});\n    let stderr='';\n    const timer=setTimeout(()=>{child.kill('SIGKILL');reject(new Error(`FFmpeg timed out\\n${stderr.slice(-4000)}`));},timeoutMs);\n    child.stderr.on('data',d=>{stderr+=String(d);if(stderr.length>12000)stderr=stderr.slice(-12000);});\n    child.once('error',e=>{clearTimeout(timer);reject(e);});\n    child.once('close',code=>{clearTimeout(timer);if(code===0)resolve();else reject(new Error(`FFmpeg exited ${code}\\n${stderr.slice(-4000)}`));});\n  });\n}\n'''

          # server renderer
          def server(s):
              s=s.replace("import { execFileSync, spawnSync } from 'node:child_process';","import { execFileSync, spawn } from 'node:child_process';",1)
              if 'function runFFmpeg(args:string[]' not in s:
                  pat=r"(function hasAudio\(path:string\)\{[\s\S]*?\}\n)(function getProject)"
                  s,n=re.subn(pat,lambda m:m.group(1)+runner+m.group(2),s,count=1)
                  if n!=1: raise SystemExit('server runner insertion failed')
              s=s.replace("app.post('/api/projects/:id/render',(req,res)=>{","app.post('/api/projects/:id/render',async(req,res)=>{",1)
              old="const result=spawnSync('ffmpeg',args,{encoding:'utf8',timeout:180000});if(result.status!==0||!existsSync(output))return res.status(500).json({error:'FFmpeg render failed',detail:result.stderr?.slice(-3500)});res.download(output,'ai-creative-studio.mp4',()=>{try{unlinkSync(output);}catch{}});"
              new="try{await runFFmpeg(args);}catch(error){try{if(existsSync(output))unlinkSync(output);}catch{};return res.status(500).json({error:'FFmpeg render failed',detail:error instanceof Error?error.message:String(error)});}if(!existsSync(output))return res.status(500).json({error:'FFmpeg render produced no output'});res.download(output,'ai-creative-studio.mp4',()=>{try{unlinkSync(output);}catch{}});"
              if old in s: s=s.replace(old,new,1)
              else: raise SystemExit('server blocking render block not found')
              if 'const requestedWidth=' not in s:
                  anchor="const output=join(EXPORTS,`${randomUUID()}.mp4`);const args="
                  replacement="const requestedWidth=Math.max(256,Math.min(3840,Number(req.body?.width||1280)));const requestedHeight=Math.max(144,Math.min(2160,Number(req.body?.height||720)));filter=filter.replaceAll('scale=1280:720','scale='+requestedWidth+':'+requestedHeight).replaceAll('pad=1280:720','pad='+requestedWidth+':'+requestedHeight);const output=join(EXPORTS,`${randomUUID()}.mp4`);const args="
                  if anchor not in s: raise SystemExit('server resolution anchor not found')
                  s=s.replace(anchor,replacement,1)
              if 'spawnSync' in s: raise SystemExit('server still contains spawnSync')
              if "Math.max(.25,Math.min(4,Number(clip.speed||1)))" in s: raise SystemExit('server speed clamp not repaired')
              return s
          edit('apps/api/src/server.ts',server)

          # AI advanced renderer
          def ai(s):
              s=s.replace("import { execFileSync, spawnSync } from 'node:child_process';","import { execFileSync, spawn } from 'node:child_process';",1)
              if 'function runFFmpeg(args:string[]' not in s:
                  pat=r"(const hasAudio=\(path:string\)=>\{[\s\S]*?\};\n)"
                  s,n=re.subn(pat,lambda m:m.group(1)+runner,s,count=1)
                  if n!=1: raise SystemExit('AI runner insertion failed')
              old="const result=spawnSync('ffmpeg',['-y',...inputs,'-filter_complex',filter,'-map','[vout]','-map','[aout]','-c:v','libx264','-preset','veryfast','-pix_fmt','yuv420p','-c:a','aac','-movflags','+faststart',output],{encoding:'utf8',timeout:180000});if(result.status!==0||!existsSync(output))return res.status(500).json({error:'FFmpeg advanced render failed',detail:result.stderr?.slice(-4000)});res.download(output,'ai-creative-studio.mp4',()=>{try{unlinkSync(output);}catch{}});"
              new="try{await runFFmpeg(['-y',...inputs,'-filter_complex',filter,'-map','[vout]','-map','[aout]','-c:v','libx264','-preset','veryfast','-pix_fmt','yuv420p','-c:a','aac','-movflags','+faststart',output]);}catch(error){try{if(existsSync(output))unlinkSync(output);}catch{};return res.status(500).json({error:'FFmpeg advanced render failed',detail:error instanceof Error?error.message:String(error)});}if(!existsSync(output))return res.status(500).json({error:'FFmpeg advanced render produced no output'});res.download(output,'ai-creative-studio.mp4',()=>{try{unlinkSync(output);}catch{}});"
              if old in s: s=s.replace(old,new,1)
              else:
                  raise SystemExit('AI blocking render block not found')
              s=s.replace("const atempo=(speed:number)=>{let x=Math.max(.25,Math.min(4,speed));","const atempo=(speed:number)=>{let x=Math.max(.1,Math.min(100,speed));",1)
              s=s.replace("const speed=Math.max(.25,Math.min(4,Number(clip.speed||1)));","const speed=Math.max(.1,Math.min(100,Number(clip.speed||1)));",1)
              s=s.replace("else if(command.type==='set_speed')target.speed=Math.max(.25,Math.min(4,Number(command.value??1)));","else if(command.type==='set_speed')target.speed=Math.max(.1,Math.min(100,Number(command.value??1)));",1)
              if 'SUPPORTED_RENDER_EFFECTS' not in s:
                  marker="const escText=(text:string)=>String(text).replace(/\\\\/g,'\\\\\\\\').replace(/:/g,'\\\\:').replace(/'/g,\"\\\\'\").replace(/%/g,'\\\\%').replace(/\\n/g,'\\\\n');"
                  if marker not in s: raise SystemExit('AI effect marker not found')
                  s=s.replace(marker,marker+"const SUPPORTED_RENDER_EFFECTS=new Set(['blur','vignette','grain','enhance','night','voice-enhance','noise-reduce']);",1)
              old_effect="else if(command.type==='set_effect'){const effect=String(command.effect||'').toLowerCase();target.effects=target.effects.filter((e:string)=>e!==effect);if(effect)target.effects.push(effect);}"
              new_effect="else if(command.type==='set_effect'){const effect=String(command.effect||'').toLowerCase();if(!SUPPORTED_RENDER_EFFECTS.has(effect)){return res.status(422).json({provider:'local',command:{type:'noop',message:`التأثير ${effect||'المطلوب'} غير مدعوم في المُصيّر الحالي.`},unsupportedEffect:effect,timeline});}target.effects=target.effects.filter((e:string)=>e!==effect);if(effect)target.effects.push(effect);}"
              if old_effect in s: s=s.replace(old_effect,new_effect,1)
              elif 'SUPPORTED_RENDER_EFFECTS' in s and new_effect not in s: raise SystemExit('AI effect branch not found')
              if 'const requestedWidth=' not in s:
                  anchor="const output=join(EXPORTS,`${randomUUID()}.mp4`);try{await runFFmpeg"
                  replacement="const requestedWidth=Math.max(256,Math.min(3840,Number(req.body?.width||1280)));const requestedHeight=Math.max(144,Math.min(2160,Number(req.body?.height||720)));filter=filter.replaceAll('scale=1280:720','scale='+requestedWidth+':'+requestedHeight).replaceAll('pad=1280:720','pad='+requestedWidth+':'+requestedHeight);const output=join(EXPORTS,`${randomUUID()}.mp4`);try{await runFFmpeg"
                  if anchor not in s: raise SystemExit('AI resolution anchor not found')
                  s=s.replace(anchor,replacement,1)
              if 'spawnSync' in s: raise SystemExit('AI still contains spawnSync')
              return s
          edit('apps/api/src/aiRoute.ts',ai)

          print('verified renderer source transformations complete')

      - name: Build and run media regression
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run test:api

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.ts apps/api/src/aiRoute.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(render): verify asynchronous export pipeline"
          git push
