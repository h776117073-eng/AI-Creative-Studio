name: Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'tools/android/**'
      - 'third_party/**'
      - 'packages/**'
      - 'apps/android/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout product repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android API 36 toolchain from preinstalled SDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" >/dev/null
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -x "$ANDROID_HOME/emulator/emulator"
      - name: Download pinned ClearCut source archive
        env:
          CLEARCUT_SHA: ba6d118722b23386567c84bce8442a400713748b
        run: |
          mkdir -p android-build/clearcut
          curl -L --fail --retry 3 --retry-all-errors "https://github.com/SysAdminDoc/ClearCut/archive/${CLEARCUT_SHA}.tar.gz" -o /tmp/clearcut.tar.gz
          tar -xzf /tmp/clearcut.tar.gz --strip-components=1 -C android-build/clearcut
          chmod +x android-build/clearcut/gradlew
      - name: Apply AI Creative Studio product integration
        run: |
          python3 tools/android/apply_clearcut_patch.py android-build/clearcut
          python3 tools/android/fix_clearcut_patch.py android-build/clearcut
          python3 tools/android/upgrade_vireon_ai_patch.py android-build/clearcut
          python3 tools/android/enhance_vireon_product.py android-build/clearcut
          python3 tools/android/apply_locale_bootstrap.py android-build/clearcut
          python3 tools/android/harden_vireon_ui.py android-build/clearcut
          python3 tools/android/harden_vireon_agent.py android-build/clearcut
      - name: Remove stale upstream dependency verification metadata from ephemeral build
        run: rm -f android-build/clearcut/gradle/verification-metadata.xml
      - name: Configure CI source-audit exclusions
        run: python3 tools/android/configure_ci_test_filter.py android-build/clearcut
      - name: Run native Kotlin/Compose unit tests
        working-directory: android-build/clearcut
        run: ./gradlew :app:testQaUnitTest --no-daemon --stacktrace -Dorg.gradle.dependency.verification=off -PciSourceAuditExclusions=true
      - name: Verify test report and coverage count
        run: |
          RESULTS="android-build/clearcut/app/build/test-results/testQaUnitTest"
          test -d "$RESULTS"
          TEST_COUNT=$(grep -Roh 'tests="[0-9][0-9]*"' "$RESULTS" | sed -E 's/[^0-9]//g' | awk '{s+=$1} END{print s+0}')
          echo "Runtime unit tests completed: $TEST_COUNT"
          test "$TEST_COUNT" -ge 1500
      - name: Build installable debug APK
        working-directory: android-build/clearcut
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.dependency.verification=off
      - name: Locate and validate generated APK
        run: |
          python3 tools/android/verify_and_prepare_apk.py android-build/clearcut android-build/AI-Creative-Studio-debug.apk
          echo "APK_PATH=android-build/AI-Creative-Studio-debug.apk" >> "$GITHUB_ENV"
      - name: Product smoke validation
        run: python3 tools/android/validate_product_smoke.py android-build/clearcut
      - name: Install Android emulator image
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "system-images;android-35;google_apis;x86_64" >/dev/null
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n vireon-ci -k "system-images;android-35;google_apis;x86_64" --force --device "pixel_6"
      - name: UI smoke test on headless emulator (Arabic + English)
        env:
          APK_PATH: android-build/AI-Creative-Studio-debug.apk
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          "$ANDROID_HOME/emulator/emulator" -avd vireon-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > /tmp/vireon-emulator.log 2>&1 &
          EMU_PID=$!
          trap 'adb emu kill || true; kill "$EMU_PID" 2>/dev/null || true' EXIT
          adb wait-for-device
          for _ in $(seq 1 90); do
            BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$BOOTED" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb install -r "$APK_PATH"
          adb shell am force-stop com.aicreativestudio.mobile
          adb shell am start -n com.aicreativestudio.mobile/.MainActivity --ez vireon_smoke true
          sleep 10
          adb shell uiautomator dump /sdcard/vireon-ar.xml >/dev/null
          adb pull /sdcard/vireon-ar.xml android-build/vireon-ar.xml >/dev/null
          python3 - <<'PY'
import re
s=open('android-build/vireon-ar.xml',encoding='utf-8').read()
required=['Vireon','الإعدادات','مساعد المونتاج الذكي','تصدير','الصوت','القص']
missing=[x for x in required if x not in s]
if missing: raise SystemExit(f'Missing Arabic UI markers: {missing}')
print('Arabic UI markers present:', ', '.join(required))
PY
          adb exec-out screencap -p > android-build/vireon-ar.png
          python3 - <<'PY'
import subprocess,xml.etree.ElementTree as ET,re,time
xml='android-build/vireon-ar.xml'
def locate(text):
    root=ET.parse(xml).getroot()
    for n in root.iter('node'):
        hay=' '.join(n.attrib.get(k,'') for k in ('text','content-desc','resource-id'))
        if text in hay:
            nums=[int(x) for x in re.findall(r'\d+',n.attrib.get('bounds',''))]
            if len(nums)==4:return (nums[0]+nums[2])//2,(nums[1]+nums[3])//2
    return None
pt=locate('الإعدادات')
if not pt: raise SystemExit('Settings control not found in Arabic UI')
subprocess.run(['adb','shell','input','tap',str(pt[0]),str(pt[1])],check=True)
time.sleep(1)
subprocess.run(['adb','shell','uiautomator','dump','/sdcard/vireon-settings.xml'],check=True,stdout=subprocess.DEVNULL)
subprocess.run(['adb','pull','/sdcard/vireon-settings.xml','android-build/vireon-settings.xml'],check=True,stdout=subprocess.DEVNULL)
s=open('android-build/vireon-settings.xml',encoding='utf-8').read()
if 'English' not in s: raise SystemExit('English language selector not found')
root=ET.fromstring(s)
for n in root.iter('node'):
    if n.attrib.get('text')=='English':
        nums=[int(x) for x in re.findall(r'\d+',n.attrib.get('bounds',''))]
        if len(nums)==4:
            subprocess.run(['adb','shell','input','tap',str((nums[0]+nums[2])//2),str((nums[1]+nums[3])//2)],check=True);break
else: raise SystemExit('English selector bounds missing')
time.sleep(4)
subprocess.run(['adb','shell','uiautomator','dump','/sdcard/vireon-en.xml'],check=True,stdout=subprocess.DEVNULL)
subprocess.run(['adb','pull','/sdcard/vireon-en.xml','android-build/vireon-en.xml'],check=True,stdout=subprocess.DEVNULL)
en=open('android-build/vireon-en.xml',encoding='utf-8').read()
required=['Vireon','Settings','AI Editing Assistant','Export','Audio','Cut']
missing=[x for x in required if x not in en]
if missing: raise SystemExit(f'Missing English UI markers: {missing}')
for forbidden in ('الإعدادات','مساعد المونتاج الذكي','الصوت','القص','تصدير'):
    if forbidden in en: raise SystemExit(f'Arabic literal leaked after English switch: {forbidden}')
print('English UI markers present and sampled Arabic labels absent:', ', '.join(required))
PY
          adb exec-out screencap -p > android-build/vireon-en.png
      - name: Upload UI smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: vireon-ui-smoke-evidence
          path: |
            android-build/vireon-ar.png
            android-build/vireon-en.png
            android-build/vireon-ar.xml
            android-build/vireon-settings.xml
            android-build/vireon-en.xml
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-creative-studio-kotlin-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-creative-studio-kotlin-test-reports
          path: |
            android-build/clearcut/app/build/reports/tests/testQaUnitTest/**
            android-build/clearcut/app/build/test-results/testQaUnitTest/**
          if-no-files-found: ignore
          retention-days: 7
