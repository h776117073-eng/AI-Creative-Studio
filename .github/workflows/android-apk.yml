name: Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'tools/android/**'
      - 'third_party/**'
      - 'packages/**'
      - 'apps/android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout product repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Download pinned ClearCut source archive
        env:
          CLEARCUT_SHA: ba6d118722b23386567c84bce8442a400713748b
        run: |
          mkdir -p android-build/clearcut
          curl -L --fail --retry 3 --retry-all-errors \
            "https://github.com/SysAdminDoc/ClearCut/archive/${CLEARCUT_SHA}.tar.gz" \
            -o /tmp/clearcut.tar.gz
          tar -xzf /tmp/clearcut.tar.gz --strip-components=1 -C android-build/clearcut
          chmod +x android-build/clearcut/gradlew
          test -x android-build/clearcut/gradlew

      - name: Apply AI Creative Studio product integration
        run: |
          python3 tools/android/apply_clearcut_patch.py android-build/clearcut
          python3 tools/android/fix_clearcut_patch.py android-build/clearcut

      - name: Remove stale upstream dependency verification metadata from ephemeral build
        run: rm -f android-build/clearcut/gradle/verification-metadata.xml

      - name: Run native Kotlin/Compose unit tests
        working-directory: android-build/clearcut
        run: ./gradlew :app:testQaUnitTest --no-daemon --stacktrace -Dorg.gradle.dependency.verification=off

      - name: Build installable debug APK
        working-directory: android-build/clearcut
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.dependency.verification=off

      - name: Verify APK exists and is non-trivial
        run: |
          APK="android-build/clearcut/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BYTES=$(stat -c%s "$APK")
          echo "APK size: $BYTES bytes"
          test "$BYTES" -gt 5000000

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-creative-studio-kotlin-apk
          path: android-build/clearcut/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-creative-studio-kotlin-test-reports
          path: |
            android-build/clearcut/app/build/reports/tests/testQaUnitTest/**
            android-build/clearcut/app/build/test-results/testQaUnitTest/**
          if-no-files-found: ignore
          retention-days: 7
