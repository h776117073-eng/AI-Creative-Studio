name: Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'tools/android/**'
      - 'third_party/**'
      - 'packages/**'
      - 'apps/android/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout product repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 36 toolchain from preinstalled SDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Download pinned ClearCut source archive
        env:
          CLEARCUT_SHA: ba6d118722b23386567c84bce8442a400713748b
        run: |
          mkdir -p android-build/clearcut
          curl -L --fail --retry 3 --retry-all-errors \
            "https://github.com/SysAdminDoc/ClearCut/archive/${CLEARCUT_SHA}.tar.gz" \
            -o /tmp/clearcut.tar.gz
          tar -xzf /tmp/clearcut.tar.gz --strip-components=1 -C android-build/clearcut
          chmod +x android-build/clearcut/gradlew
          test -x android-build/clearcut/gradlew

      - name: Apply AI Creative Studio product integration
        run: |
          python3 tools/android/apply_clearcut_patch.py android-build/clearcut
          python3 tools/android/fix_clearcut_patch.py android-build/clearcut

      - name: Remove stale upstream dependency verification metadata from ephemeral build
        run: rm -f android-build/clearcut/gradle/verification-metadata.xml

      - name: Configure CI source-audit exclusions
        run: python3 tools/android/configure_ci_test_filter.py android-build/clearcut

      - name: Run native Kotlin/Compose unit tests
        working-directory: android-build/clearcut
        run: |
          ./gradlew :app:testQaUnitTest --no-daemon --stacktrace \
            -Dorg.gradle.dependency.verification=off \
            -PciSourceAuditExclusions=true

      - name: Verify test report and coverage count
        run: |
          RESULTS="android-build/clearcut/app/build/test-results/testQaUnitTest"
          test -d "$RESULTS"
          TEST_COUNT=$(grep -Roh 'tests="[0-9][0-9]*"' "$RESULTS" | sed -E 's/[^0-9]//g' | awk '{s+=$1} END{print s+0}')
          echo "Runtime unit tests completed: $TEST_COUNT"
          test "$TEST_COUNT" -ge 1500

      - name: Build installable debug APK
        working-directory: android-build/clearcut
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.dependency.verification=off

      - name: Locate and validate generated APK
        run: |
          python3 tools/android/verify_and_prepare_apk.py \
            android-build/clearcut \
            android-build/AI-Creative-Studio-debug.apk
          echo "APK_PATH=android-build/AI-Creative-Studio-debug.apk" >> "$GITHUB_ENV"

      - name: Product smoke validation
        run: python3 tools/android/validate_product_smoke.py android-build/clearcut

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-creative-studio-kotlin-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-creative-studio-kotlin-test-reports
          path: |
            android-build/clearcut/app/build/reports/tests/testQaUnitTest/**
            android-build/clearcut/app/build/test-results/testQaUnitTest/**
          if-no-files-found: ignore
          retention-days: 7
