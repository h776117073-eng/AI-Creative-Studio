name: Colab CLI Runner (compatibility)

on:
  workflow_dispatch:
    inputs:
      python_code:
        description: "Python code to submit to Google Colab"
        required: false
        type: string
        default: 'print("Colab automation smoke test")'
      timeout_seconds:
        description: "Execution timeout in seconds"
        required: true
        type: number
        default: 900
  repository_dispatch:
    types: [colab_bridge_run]

permissions:
  contents: read

jobs:
  delegate-to-colab-on-demand:
    uses: ./.github/workflows/colab_on_demand.yml
    with:
      task_code: ${{ github.event.client_payload.python_code || inputs.python_code || 'print("Colab automation smoke test")' }}
      script_path: ""
      accelerator: "none"
      timeout_seconds: ${{ inputs.timeout_seconds || 900 }}
    secrets: inherit
