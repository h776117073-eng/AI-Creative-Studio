name: Repair Pass 3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch renderers with structural replacements
        shell: python
        run: |
          from pathlib import Path
          import re

          def patch(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s); p.write_text(n,encoding='utf-8')
              print(path, 'changed' if n!=s else 'unchanged')

          def add_runner(s, anchor_pattern):
              if 'function runFFmpeg(args:string[]' in s: return s
              s=s.replace("import { execFileSync, spawnSync } from 'node:child_process';","import { execFileSync, spawn } from 'node:child_process';",1)
              runner="""\nfunction runFFmpeg(args:string[],timeoutMs=180000):Promise<void>{return new Promise((resolve,reject)=>{const child=spawn('ffmpeg',args,{stdio:['ignore','ignore','pipe']});let stderr='';const timer=setTimeout(()=>{child.kill('SIGKILL');reject(new Error(`FFmpeg timed out\\n${stderr.slice(-4000)}`));},timeoutMs);child.stderr.on('data',d=>{stderr+=String(d);if(stderr.length>12000)stderr=stderr.slice(-12000);});child.once('error',e=>{clearTimeout(timer);reject(e)});child.once('close',code=>{clearTimeout(timer);if(code===0)resolve();else reject(new Error(`FFmpeg exited ${code}\\n${stderr.slice(-4000)}`))});});}\n"""
              m=re.search(anchor_pattern,s)
              if not m: raise SystemExit('runner anchor not found')
              pos=m.end(); return s[:pos]+runner+s[pos:]

          patch('apps/api/src/server.ts',lambda s:add_runner(s,r"function hasAudio\([^\n]+\n"))
          patch('apps/api/src/server.ts',lambda s:s.replace("app.post('/api/projects/:id/render',(req,res)=>{","app.post('/api/projects/:id/render',async(req,res)=>{",1) if "app.post('/api/projects/:id/render',(req,res)=>{" in s else s)
          def server_render(s):
              s=s.replace("const result=spawnSync('ffmpeg',args,{encoding:'utf8',timeout:180000});if(result.status!==0||!existsSync(output))return res.status(500).json({error:'FFmpeg render failed',detail:result.stderr?.slice(-3500)});res.download(output,'ai-creative-studio.mp4',()=>{try{unlinkSync(output);}catch{}});","try{await runFFmpeg(args);}catch(error){try{if(existsSync(output))unlinkSync(output);}catch{};return res.status(500).json({error:'FFmpeg render failed',detail:error instanceof Error?error.message:String(error)});}if(!existsSync(output))return res.status(500).json({error:'FFmpeg render produced no output'});res.download(output,'ai-creative-studio.mp4',()=>{try{unlinkSync(output);}catch{}});",1)
              if 'const result=spawnSync' in s: raise SystemExit('server still has blocking spawnSync')
              if "const requestedWidth=" not in s:
                  s=s.replace("const output=join(EXPORTS,`${randomUUID()}.mp4`);const args=","const requestedWidth=Math.max(256,Math.min(3840,Number(req.body?.width||1280)));const requestedHeight=Math.max(144,Math.min(2160,Number(req.body?.height||720)));filter=filter.replaceAll('scale=1280:720','scale='+requestedWidth+':'+requestedHeight).replaceAll('pad=1280:720','pad='+requestedWidth+':'+requestedHeight);const output=join(EXPORTS,`${randomUUID()}.mp4`);const args=",1)
              return s
          patch('apps/api/src/server.ts',server_render)

          patch('apps/api/src/aiRoute.ts',lambda s:add_runner(s,r"const hasAudio\([^\n]+\n"))
          def ai_render(s):
              s=s.replace("import { execFileSync, spawnSync } from 'node:child_process';","import { execFileSync, spawn } from 'node:child_process';",1)
              if "const requestedWidth=" not in s:
                  s=s.replace("const output=join(EXPORTS,`${randomUUID()}.mp4`);const result=spawnSync('ffmpeg'","const requestedWidth=Math.max(256,Math.min(3840,Number(req.body?.width||1280)));const requestedHeight=Math.max(144,Math.min(2160,Number(req.body?.height||720)));filter=filter.replaceAll('scale=1280:720','scale='+requestedWidth+':'+requestedHeight).replaceAll('pad=1280:720','pad='+requestedWidth+':'+requestedHeight);const output=join(EXPORTS,`${randomUUID()}.mp4`);const result=spawnSync('ffmpeg'",1)
              s=s.replace("const output=join(EXPORTS,`${randomUUID()}.mp4`);const result=spawnSync('ffmpeg'","const output=join(EXPORTS,`${randomUUID()}.mp4`);const result=spawnSync('ffmpeg'",1)
              if 'const result=spawnSync' in s:
                  old=re.search(r"const result=spawnSync\('ffmpeg',\['-y',\.\.\.inputs,[\s\S]*?res\.download\(output,'ai-creative-studio\.mp4',[\s\S]*?\);",s)
                  if old:
                      repl="const result=spawnSync('ffmpeg',args,{encoding:'utf8',timeout:180000});"
                      # advanced route has inline args; replace only the spawnSync assignment through download with an awaited invocation by extracting its args.
                      block=old.group(0)
                      args_match=re.search(r"spawnSync\('ffmpeg',\[(.*?)\],\{encoding:'utf8',timeout:180000\}\)",block,re.S)
                      if args_match:
                          args=args_match.group(1)
                          newblock="try{await runFFmpeg(["+args+"]);}catch(error){try{if(existsSync(output))unlinkSync(output);}catch{};return res.status(500).json({error:'FFmpeg advanced render failed',detail:error instanceof Error?error.message:String(error)});}if(!existsSync(output))return res.status(500).json({error:'FFmpeg advanced render produced no output'});res.download(output,'ai-creative-studio.mp4',()=>{try{unlinkSync(output);}catch{}});"
                          s=s[:old.start()]+newblock+s[old.end():]
              s=s.replace("const atempo=(speed:number)=>{let x=Math.max(.25,Math.min(4,speed));","const atempo=(speed:number)=>{let x=Math.max(.1,Math.min(100,speed));",1)
              s=s.replace("const speed=Math.max(.25,Math.min(4,Number(clip.speed||1)));","const speed=Math.max(.1,Math.min(100,Number(clip.speed||1)));",1)
              s=s.replace("else if(command.type==='set_speed')target.speed=Math.max(.25,Math.min(4,Number(command.value??1)));","else if(command.type==='set_speed')target.speed=Math.max(.1,Math.min(100,Number(command.value??1)));",1)
              return s
          patch('apps/api/src/aiRoute.ts',ai_render)

          # Add an explicit support registry and reject metadata-only effects.
          patch('apps/api/src/aiRoute.ts',lambda s:s if 'SUPPORTED_RENDER_EFFECTS' in s else s.replace("const escText=(text:string)=>String(text).replace(/\\\\/g,'\\\\\\\\').replace(/:/g,'\\\\:').replace(/'/g,\"\\\\'\").replace(/%/g,'\\\\%').replace(/\\n/g,'\\\\n');","const escText=(text:string)=>String(text).replace(/\\\\/g,'\\\\\\\\').replace(/:/g,'\\\\:').replace(/'/g,\"\\\\'\").replace(/%/g,'\\\\%').replace(/\\n/g,'\\\\n');const SUPPORTED_RENDER_EFFECTS=new Set(['blur','vignette','grain','enhance','night','voice-enhance','noise-reduce']);",1))
          patch('apps/api/src/aiRoute.ts',lambda s:s.replace("else if(command.type==='set_effect'){const effect=String(command.effect||'').toLowerCase();target.effects=target.effects.filter((e:string)=>e!==effect);if(effect)target.effects.push(effect);}","else if(command.type==='set_effect'){const effect=String(command.effect||'').toLowerCase();if(!SUPPORTED_RENDER_EFFECTS.has(effect)){return res.status(422).json({provider:'local',command:{type:'noop',message:`التأثير ${effect||'المطلوب'} غير مدعوم في المُصيّر الحالي.`},unsupportedEffect:effect,timeline});}target.effects=target.effects.filter((e:string)=>e!==effect);if(effect)target.effects.push(effect);}",1) if "SUPPORTED_RENDER_EFFECTS" in s else s)

          print('robust render repair completed')
      - name: Validate production build and regression
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run test:api
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.ts apps/api/src/aiRoute.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(render): stabilize asynchronous export pipeline"
          git push
