name: Arabic Dubbing from Prepared Drive Data

on:
  push:
    branches: [main]
    paths:
      - control/dubbing-request.json
  workflow_dispatch:
    inputs:
      source_url:
        description: Google Drive link to authorized source video
        required: true
        type: string
        default: https://drive.google.com/file/d/1sMis6qi_j3AsBvAEL2mliPRIKf0s3-uI/view?usp=drivesdk
      episode_data_url:
        description: Google Drive link to episode_data.zip
        required: true
        type: string
        default: https://drive.google.com/file/d/13Je0tv3X7YroOOQE0hARDAFBSxbYUUFO/view?usp=drivesdk
      rights_confirmed:
        description: Confirm permission to make and store the dubbed derivative
        required: true
        type: choice
        options: ["no", "yes"]
        default: "yes"
      asr_model:
        description: Model used to transcribe short voice reference samples
        required: true
        type: choice
        options: ["tiny", "base", "small"]
        default: "small"

permissions:
  contents: read

concurrency:
  group: prepared-arabic-dubbing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and validate request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE_URL: ${{ inputs.source_url }}
          DISPATCH_DATA_URL: ${{ inputs.episode_data_url }}
          DISPATCH_RIGHTS: ${{ inputs.rights_confirmed }}
          DISPATCH_ASR_MODEL: ${{ inputs.asr_model }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib.parse import urlparse
          if os.environ["EVENT_NAME"] == "push":
              with open("control/dubbing-request.json", encoding="utf-8") as f:
                  req = json.load(f)
              source = str(req.get("source_url", "")).strip()
              data = str(req.get("episode_data_url", "")).strip()
              rights = str(req.get("rights_confirmed", "no")).lower()
              asr = str(req.get("asr_model") or "small")
          else:
              source = os.environ.get("DISPATCH_SOURCE_URL", "").strip()
              data = os.environ.get("DISPATCH_DATA_URL", "").strip()
              rights = os.environ.get("DISPATCH_RIGHTS", "no").lower()
              asr = os.environ.get("DISPATCH_ASR_MODEL", "small")
          if rights != "yes":
              raise SystemExit("Refusing to process until rights_confirmed is yes.")
          for key, url in (("source_url", source), ("episode_data_url", data)):
              p = urlparse(url)
              if p.scheme != "https" or p.hostname not in {"drive.google.com", "drive.usercontent.google.com"}:
                  raise SystemExit(f"{key} must be an HTTPS Google Drive link.")
          if asr not in {"tiny", "base", "small"}:
              raise SystemExit("asr_model must be tiny, base, or small.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"source_url={source}\n")
              out.write(f"episode_data_url={data}\n")
              out.write(f"asr_model={asr}\n")
          print("Request validated; URLs omitted from logs.")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg git unzip build-essential cmake libsndfile1

      - name: Install dubbing dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # NeuCodec 0.0.6 requires NumPy >=2.0.2. Install CPU-only PyTorch first
          # so the runner does not pull the large CUDA build from the default index.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1" "torchaudio==2.7.1"
          python -m pip install "numpy==2.0.2" soundfile faster-whisper gdown "huggingface_hub==0.36.0" "transformers==4.49.0" llama-cpp-python "torch==2.7.1" "torchaudio==2.7.1" "neucodec==0.0.6" "torchao==0.12.0" "torchtune==0.3.1" "local-attention==1.11.2" "vector-quantize-pytorch==1.17.8"

      - name: Restore resumable voice and audio checkpoints
        uses: actions/cache/restore@v4
        with:
          path: |
            work/dub/translated_segments.json
            work/dub/transcript_source.json
            work/dub/transcript_source_with_speakers.json
            work/dub/speaker_profiles.json
            work/dub/transcript_ar.json
            work/dub/run_manifest.json
            work/dub/segments/
            work/dub/voice_refs/
            work/dub/models/
            ~/.cache/huggingface/hub/
            ~/.cache/torch/
          key: prepared-arabic-dub-${{ hashFiles('scripts/dub_from_episode_data.py') }}-${{ github.run_id }}
          restore-keys: |
            prepared-arabic-dub-${{ hashFiles('scripts/dub_from_episode_data.py') }}-

      - name: Download source video from Google Drive
        env:
          SOURCE_URL: ${{ steps.request.outputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p work/source output
          gdown "$SOURCE_URL" -O work/source/source_download.mkv --continue
          test -s work/source/source_download.mkv
          echo "Source retrieved; bytes=$(stat -c%s work/source/source_download.mkv)"

      - name: Download prepared episode data from Google Drive
        env:
          DATA_URL: ${{ steps.request.outputs.episode_data_url }}
        run: |
          set -euo pipefail
          gdown "$DATA_URL" -O work/source/episode_data.zip --continue
          test -s work/source/episode_data.zip
          mkdir -p work/input_data
          unzip -q -o work/source/episode_data.zip -d work/input_data
          test -s work/input_data/episode_data/episode_metadata.json
          test -s work/input_data/episode_data/arabic_translation.jsonl
          test -s work/input_data/episode_data/words.jsonl
          echo "Prepared episode data extracted."

      - name: Probe, hash, normalize, and extract source audio
        id: prepare
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration,size,format_name:stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json work/source/source_download.mkv | tee output/source_probe.json
          python - <<'PY'
          import json
          p = json.load(open("output/source_probe.json", encoding="utf-8"))
          streams = p.get("streams", [])
          if not any(s.get("codec_type") == "video" for s in streams):
              raise SystemExit("No video stream")
          if not any(s.get("codec_type") == "audio" for s in streams):
              raise SystemExit("No audio stream")
          duration = float((p.get("format") or {}).get("duration") or 0)
          size = int((p.get("format") or {}).get("size") or 0)
          if duration < 1 or size < 1000000:
              raise SystemExit(f"Invalid input: {size} bytes / {duration}s")
          print(f"Source verified: {duration:.3f}s, {size} bytes")
          PY
          SOURCE_SHA256="$(sha256sum work/source/source_download.mkv | cut -d' ' -f1)"
          SOURCE_DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 work/source/source_download.mkv)"
          TASK_ID="$(printf '%s' "$SOURCE_SHA256" | cut -c1-16)"
          # Keep the original MKV to avoid an unnecessary full-video remux/transcode before dubbing.
          # The final render will mux the original video stream once with the new Arabic audio.
          ffmpeg -y -v error -i work/source/source_download.mkv -map 0:a:0 -vn -ac 1 -ar 16000 -c:a pcm_s16le work/source/source_audio.wav
          test -s work/source/source.mp4
          test -s work/source/source_audio.wav
          echo "$SOURCE_SHA256" > output/source_sha256.txt
          echo "source_sha256=$SOURCE_SHA256" >> "$GITHUB_OUTPUT"
          echo "source_duration=$SOURCE_DURATION" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

      - name: Clone Audar-TTS code
        run: |
          set -euo pipefail
          mkdir -p third_party
          if [ ! -f third_party/Audar-TTS-V1/audar_tts/__init__.py ]; then
            rm -rf third_party/Audar-TTS-V1
            git clone --depth 1 https://github.com/AudarAI/Audar-TTS-V1.git third_party/Audar-TTS-V1
          fi

      - name: Syntax-check pipeline
        run: |
          set -euo pipefail
          python -m py_compile scripts/dub_arabic_multispeaker.py scripts/dub_arabic_cpu.py scripts/dub_from_episode_data.py scripts/upload_google_drive.py
          test -f third_party/Audar-TTS-V1/audar_tts/__init__.py

      - name: Generate resumable Arabic dialogue audio from prepared data
        id: dubbing
        env:
          SOURCE_SHA256: ${{ steps.prepare.outputs.source_sha256 }}
          ASR_MODEL: ${{ steps.request.outputs.asr_model }}
        run: |
          set -euo pipefail
          python scripts/dub_from_episode_data.py --audio work/source/source_audio.wav --episode-data-dir work/input_data/episode_data --out-dir work/dub --asr-model "$ASR_MODEL" --source-sha256 "$SOURCE_SHA256" --max-atempo 1.45
          test -s work/dub/dub_ar.wav
          test -s work/dub/speaker_profiles.json
          test -s work/dub/transcript_ar.json
          test -s work/dub/run_manifest.json
          rm -f work/source/source_audio.wav

      - name: Render and verify final audio-dubbed MP4
        id: render
        env:
          SOURCE_DURATION: ${{ steps.prepare.outputs.source_duration }}
          TASK_ID: ${{ steps.prepare.outputs.task_id }}
        run: |
          set -euo pipefail
          FINAL="output/Arabic_Dub_"$TASK_ID".mp4"
          # Keep the original mix quietly for ambiance/music; source dialogue may remain audible.
          ffmpeg -y -v error -i work/source/source_download.mkv -i work/dub/dub_ar.wav \
            -filter_complex "[0:a]volume=0.04[amb];[1:a]volume=1.0[ar];[amb][ar]amix=inputs=2:duration=longest:normalize=0,alimiter=limit=0.95[aout]" \
            -map 0:v:0 -map "[aout]" -c:v copy -c:a aac -b:a 192k -t "$SOURCE_DURATION" -movflags +faststart "$FINAL"
          ffprobe -v error -show_entries format=duration,size,format_name -show_entries stream=codec_type,codec_name,width,height,sample_rate,channels -of json "$FINAL" | tee output/final_probe.json
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          task_id = os.environ["TASK_ID"]
          final = Path("output/Arabic_Dub_" + task_id + ".mp4")
          probe = json.load(open("output/final_probe.json", encoding="utf-8"))
          info, streams = probe.get("format", {}), probe.get("streams", [])
          size = int(info.get("size") or 0)
          duration = float(info.get("duration") or 0)
          source_duration = float(os.environ["SOURCE_DURATION"])
          if not final.is_file() or size < 1000000:
              raise SystemExit(f"Final MP4 missing or too small: {size} bytes")
          if abs(duration - source_duration) > 3.0:
              raise SystemExit(f"Duration mismatch: source={source_duration:.3f}s output={duration:.3f}s")
          if not any(s.get("codec_type") == "video" for s in streams):
              raise SystemExit("No video stream")
          if not any(s.get("codec_type") == "audio" and s.get("codec_name") == "aac" for s in streams):
              raise SystemExit("No AAC audio stream")
          subprocess.run(["ffmpeg", "-v", "error", "-i", str(final), "-f", "null", "-"], check=True, timeout=1800)
          h = hashlib.sha256()
          with final.open("rb") as f:
              for block in iter(lambda: f.read(1024*1024), b""):
                  h.update(block)
          digest = h.hexdigest()
          Path("output/SHA256SUMS.txt").write_text(f"{digest}  {final.name}\n", encoding="utf-8")
          manifest = json.load(open("work/dub/run_manifest.json", encoding="utf-8"))
          manifest.update({
              "status": "AUDIO_DUBBED_MP4_VERIFIED_LIP_SYNC_PENDING",
              "final_file": str(final),
              "final_duration_seconds": duration,
              "final_size_bytes": size,
              "final_sha256": digest,
              "ffprobe_and_full_decode": "passed",
              "lip_sync_status": "pending; no mouth frames modified in this CPU-only run",
              "drive_upload_status": "pending",
          })
          json.dump(manifest, open("output/run_manifest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Audio-dubbed MP4 verified\n\n")
              f.write(f"- Task ID: {task_id}\n- Source duration: {source_duration:.3f}s\n- Output duration: {duration:.3f}s\n")
              f.write(f"- Size: {size} bytes\n- SHA-256: {digest}\n- Full FFmpeg decode: passed\n")
              f.write("- Lip-sync modification: not performed in this CPU-only workflow\n")
          print(json.dumps({"status": "VERIFIED_AUDIO_DUB_MP4", "duration": duration, "size_bytes": size, "sha256": digest}, ensure_ascii=False))
          PY

      - name: Save resumable checkpoints
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            work/dub/translated_segments.json
            work/dub/transcript_source.json
            work/dub/transcript_source_with_speakers.json
            work/dub/speaker_profiles.json
            work/dub/transcript_ar.json
            work/dub/run_manifest.json
            work/dub/segments/
            work/dub/voice_refs/
            work/dub/models/
            ~/.cache/huggingface/hub/
            ~/.cache/torch/
          key: prepared-arabic-dub-${{ hashFiles('scripts/dub_from_episode_data.py') }}-${{ github.run_id }}

      - name: Upload MP4 and diagnostics as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Arabic-Dub-Prepared-${{ github.run_id }}
          path: |
            output/
            work/dub/run_manifest.json
            work/dub/quality_report.md
            work/dub/speaker_profiles.json
            work/dub/transcript_source.json
            work/dub/transcript_source_with_speakers.json
            work/dub/transcript_ar.json
            work/dub/translated_segments.json
            work/dub/lip_sync_plan.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified MP4 to Google Drive
        id: drive
        if: success()
        continue-on-error: true
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          TASK_ID: ${{ steps.prepare.outputs.task_id }}
          SOURCE_SHA256: ${{ steps.prepare.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_DRIVE_CREDENTIALS" ] || [ -z "$GOOGLE_DRIVE_FOLDER_ID" ]; then
            echo "Drive upload not configured: add GOOGLE_DRIVE_CREDENTIALS and GOOGLE_DRIVE_FOLDER_ID to Actions secrets."
            exit 2
          fi
          python -m pip install google-api-python-client google-auth google-auth-httplib2
          python scripts/upload_google_drive.py --file "output/Arabic_Dub_"$TASK_ID".mp4" --task-id "$TASK_ID" --source-sha256 "$SOURCE_SHA256" --filename "Arabic-Dub-"$TASK_ID".mp4"

      - name: Enforce completion definition
        if: always()
        env:
          PREPARE_RESULT: ${{ steps.prepare.outcome }}
          DUBBING_RESULT: ${{ steps.dubbing.outcome }}
          RENDER_RESULT: ${{ steps.render.outcome }}
          DRIVE_RESULT: ${{ steps.drive.outcome }}
        run: |
          set -euo pipefail
          if [ "$PREPARE_RESULT" != "success" ]; then echo "::error::Source preparation failed."; exit 1; fi
          if [ "$DUBBING_RESULT" != "success" ]; then echo "::error::Arabic dialogue synthesis failed."; exit 1; fi
          if [ "$RENDER_RESULT" != "success" ]; then echo "::error::Final MP4 verification failed."; exit 1; fi
          if [ "$DRIVE_RESULT" != "success" ]; then echo "::error::Verified MP4 was not uploaded to Drive. Check the artifact and Drive secrets."; exit 1; fi
          echo "Verified audio-dubbed MP4 uploaded. Actual lip-sync remains pending."
