name: Arabic dub alternate MP4 dialogue probe

on:
  push:
    branches: [automation/arabic-dub-colab-recovery-20261101]
    paths:
      - ".github/workflows/arabic-dub-alternate-mp4-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arabic-dub-alternate-mp4-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install official Colab CLI
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip google-colab-cli
          colab version

      - name: Configure Colab credentials locally only
        env:
          COLAB_CREDENTIALS: ${{ secrets.COLAB_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/gcloud" output
          if [ -z "${COLAB_CREDENTIALS:-}" ]; then
            echo "::error::COLAB_CREDENTIALS is missing."
            exit 1
          fi
          python - <<'PY'
          import json, os, pathlib
          obj=json.loads(os.environ["COLAB_CREDENTIALS"])
          if obj.get("type") not in {"authorized_user","service_account","external_account","impersonated_service_account"}:
              raise SystemExit("Unsupported Colab credential type.")
          p=pathlib.Path.home()/".config/gcloud/application_default_credentials.json"
          p.write_text(os.environ["COLAB_CREDENTIALS"],encoding="utf-8"); p.chmod(0o600)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f: f.write(f"GOOGLE_APPLICATION_CREDENTIALS={p}\n")
          print("Colab credentials configured locally; secret value was not printed or transferred.")
          PY

      - name: Allocate standard Tesla T4
        run: |
          set -euo pipefail
          SESSION="arabic-dub-mp4-probe-${GITHUB_RUN_ID}"
          echo "SESSION=$SESSION" >> "$GITHUB_ENV"
          colab --auth=adc new -s "$SESSION" --gpu T4 2>&1 | tee output/session.log
          colab --auth=adc status -s "$SESSION" 2>&1 | tee output/runtime.txt
          grep -Eqi 'Hardware: T4|gpu-t4' output/runtime.txt

      - name: Prepare Arabic audio probe
        run: |
          set -euo pipefail
          mkdir -p output
          cat > output/probe_alternate_mp4.py <<'PY'
          import json, subprocess, sys, time
          from pathlib import Path

          ROOT=Path("/content/arabic_dub_mp4_probe"); ROOT.mkdir(parents=True,exist_ok=True)
          VIDEO=ROOT/"Billionaire_Granny_Arabic_Dubbed_Final.mp4"
          FILE_ID="1TjyE6CuhxxU0iGZDOE3x3S_mnxmiEqlX"
          EXPECTED_SIZE=920467672
          ranges=[
              ("lu_ming_missing_3",225.0,247.0),
              ("lu_ming_missing_6_candidate",390.0,420.0),
              ("li_yang_missing_3_candidates",60.0,100.0),
              ("zhuang_missing_3",94.0,107.0),
              ("xia_moyan_missing_2",386.0,407.0),
              ("xia_moyan_missing_5_a",680.0,750.0),
              ("xia_moyan_missing_5_b",780.0,860.0),
              ("li_huaixin_missing_7",1488.0,1502.0),
              ("lu_chenhong_missing_5",4118.0,4146.0),
              ("secondary_male_missing_2_a",1400.0,1450.0),
              ("secondary_male_missing_2_b",1560.0,1710.0),
              ("secondary_male_missing_6",5275.0,5390.0),
          ]
          def run(cmd,timeout=600):
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=timeout)
              print(p.stdout[-3000:],flush=True)
              if p.returncode: raise RuntimeError("Command failed: "+cmd[0]+" "+str(p.returncode))
              return p.stdout
          import torch
          if not torch.cuda.is_available() or "T4" not in torch.cuda.get_device_name(0).upper():
              raise RuntimeError("This diagnostic requires the allocated Tesla T4.")
          print("T4="+torch.cuda.get_device_name(0),flush=True)
          subprocess.run([sys.executable,"-m","pip","install","-q","gdown","faster-whisper"],check=True)
          import gdown
          print("ALTERNATE_MP4_DOWNLOAD_START",flush=True)
          p=gdown.download(id=FILE_ID,output=str(VIDEO),quiet=False,resume=True)
          if not p or not VIDEO.is_file() or VIDEO.stat().st_size!=EXPECTED_SIZE:
              raise RuntimeError("Alternate MP4 download missing or size mismatch.")
          print("ALTERNATE_MP4_DOWNLOAD_VERIFIED bytes="+str(VIDEO.stat().st_size),flush=True)
          info=json.loads(run(["ffprobe","-v","error","-show_format","-show_streams","-of","json",str(VIDEO)]))
          fmt=info.get("format",{})
          ast=[x for x in info.get("streams",[]) if x.get("codec_type")=="audio"]
          print("MP4_DURATION="+str(fmt.get("duration"))+" AUDIO_STREAMS="+str(len(ast)),flush=True)
          from faster_whisper import WhisperModel
          model=WhisperModel("small",device="cuda",compute_type="float16")
          results=[]
          for name,start,end in ranges:
              wav=ROOT/(name+".wav")
              out=ROOT/(name+".json")
              print("EXTRACT "+name+" "+str(start)+"-"+str(end),flush=True)
              run(["ffmpeg","-y","-hide_banner","-loglevel","error","-ss",str(start),"-i",str(VIDEO),"-t",str(end-start),"-vn","-ac","1","-ar","16000","-c:a","pcm_s16le",str(wav)],timeout=300)
              segments,meta=model.transcribe(str(wav),language="ar",beam_size=5,vad_filter=True,condition_on_previous_text=False)
              rows=[{"start":round(float(s.start)+start,3),"end":round(float(s.end)+start,3),"text":s.text.strip()} for s in segments]
              item={"name":name,"source_window":[start,end],"language":meta.language,"language_probability":meta.language_probability,"segments":rows,"transcript":" ".join(x["text"] for x in rows)}
              results.append(item)
              print("TRANSCRIPT "+name+"="+item["transcript"],flush=True)
              wav.unlink(missing_ok=True)
          report={"status":"probe_complete","mp4":{"name":VIDEO.name,"bytes":VIDEO.stat().st_size,"duration_seconds":float(fmt.get("duration") or 0),"video_streams":[{"codec":s.get("codec_name"),"width":s.get("width"),"height":s.get("height")} for s in info.get("streams",[]) if s.get("codec_type")=="video"],"audio_streams":[{"codec":s.get("codec_name"),"sample_rate":s.get("sample_rate"),"channels":s.get("channels")} for s in ast]},"ranges":results,"note":"This probes whether the older MP4 contains recoverable Arabic lines; no audio or video was modified."}
          (ROOT/"probe_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PROBE_STATUS=COMPLETE",flush=True)
          PY
          colab --auth=adc upload -s "$SESSION" output/probe_alternate_mp4.py /content/probe_alternate_mp4.py
          colab --auth=adc exec -s "$SESSION" --timeout 7200 -f output/probe_alternate_mp4.py 2>&1 | tee output/probe_execution.log

      - name: Retrieve probe report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p output/return
          colab --auth=adc download -s "$SESSION" /content/arabic_dub_mp4_probe/probe_report.json output/return/probe_report.json || true
          colab --auth=adc status -s "$SESSION" > output/session_final.txt 2>&1 || true

      - name: Stop T4
        if: always()
        continue-on-error: true
        run: colab --auth=adc stop -s "$SESSION" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arabic-dub-alternate-mp4-probe-${{ github.run_id }}
          path: output/**
          if-no-files-found: warn
          retention-days: 7
