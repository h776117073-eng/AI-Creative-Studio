name: Repair Pass 1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply high-confidence engine fixes
        shell: python
        run: |
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old,new,1),encoding='utf-8')
                  print('updated',path)
              else:
                  print('already fixed or not applicable',path)
          replace_once('packages/ai-engine/src/index.ts','this.agines.forEach(agent => {','this.agents.forEach(agent => {')
          replace_once('packages/project-engine/src/index.ts','const graph = ProjectGraph.deserialize(backup.data as any);\n    restoredProject.graph = graph;','const graph = ProjectGraph.deserialize(restoredProject.graph as any);\n    restoredProject.graph = graph;')
          replace_once('packages/animation-engine/src/index.ts',"'cubic-bezier': (t) => t,","'cubic-bezier': (t) => cubicBezierAt(0.42, 0, 0.58, 1, t),")
          p=Path('packages/animation-engine/src/index.ts'); s=p.read_text(encoding='utf-8')
          if 'function cubicBezierAt(' not in s:
              marker="export type EasingFunction = (t: number) => number;\n\n"
              helper="""export type EasingFunction = (t: number) => number;\n\nfunction cubicBezierAt(x1: number, y1: number, x2: number, y2: number, x: number): number {\n  const clamp=(v:number)=>Math.max(0,Math.min(1,v)); const cx=3*x1; const bx=3*(x2-x1)-cx; const ax=1-cx-bx; const cy=3*y1; const by=3*(y2-y1)-cy; const ay=1-cy-by;\n  const sx=(t:number)=>((ax*t+bx)*t+cx)*t; const sy=(t:number)=>((ay*t+by)*t+cy)*t; const dx=(t:number)=>(3*ax*t+2*bx)*t+cx; const target=clamp(x); let t=target;\n  for(let i=0;i<8;i++){const e=sx(t)-target;const d=dx(t);if(Math.abs(e)<1e-7||Math.abs(d)<1e-7)break;t=clamp(t-e/d);} let lo=0,hi=1;\n  for(let i=0;i<12;i++){const mid=(lo+hi)/2;if(sx(mid)<target)lo=mid;else hi=mid;} const candidate=Math.abs(sx(t)-target)<1e-5?t:(lo+hi)/2; return clamp(sy(candidate));\n}\n\n"""
              p.write_text(s.replace(marker,helper,1),encoding='utf-8')
          replace_once('packages/animation-engine/src/index.ts','duration: options?.duration ?? this.defaultDuration,','duration: Math.max(Number.EPSILON, options?.duration ?? this.defaultDuration),')
          replace_once('packages/animation-engine/src/index.ts','const localProgress = (progress - startKf.offset) / (endKf.offset - startKf.offset);','const span=endKf.offset-startKf.offset;\n    const localProgress=span<=Number.EPSILON?1:Math.max(0,Math.min(1,(progress-startKf.offset)/span));')
          replace_once('packages/rendering-engine/src/index.ts','useWebGL: z.boolean().optional().default(true),','useWebGL: z.boolean().optional().default(false),')
          replace_once('packages/rendering-engine/src/index.ts',"    if (this.usingWebGL) {\n      const context = canvas.getContext('webgl2') || canvas.getContext('webgl');","    const experimentalWebGL=this.usingWebGL && canvas.dataset.renderMode==='webgl-experimental';\n    if (experimentalWebGL) {\n      const context=canvas.getContext('webgl2') || canvas.getContext('webgl');")
          replace_once('packages/rendering-engine/src/index.ts','    this.pixelRatio = window.devicePixelRatio || 1;',"    this.pixelRatio=typeof window!=='undefined'?window.devicePixelRatio||1:1;")
          replace_once('packages/rendering-engine/src/index.ts','        devicePixelRatio: window.devicePixelRatio || 1,',"        devicePixelRatio: typeof window!=='undefined'?window.devicePixelRatio||1:1,")
          replace_once('apps/api/src/server.ts','function atempo(speed:number){let x=Math.max(.25,Math.min(4,speed));','function atempo(speed:number){let x=Math.max(.1,Math.min(100,speed));')
          replace_once('apps/api/src/server.ts','const speed=Math.max(.25,Math.min(4,Number(clip.speed||1)));','const speed=Math.max(.1,Math.min(100,Number(clip.speed||1)));')
      - name: Commit applicable fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai-engine/src/index.ts packages/project-engine/src/index.ts packages/animation-engine/src/index.ts packages/rendering-engine/src/index.ts apps/api/src/server.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(core): repair engine runtime inconsistencies"
          git push
