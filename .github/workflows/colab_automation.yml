name: Google Colab Automation (headless compatibility)

on:
  workflow_dispatch:
    inputs:
      python_code:
        description: "Python code to execute remotely"
        required: false
        type: string
        default: 'print("Hello from Google Colab")'
      timeout_seconds:
        description: "Maximum execution wait in seconds"
        required: true
        type: number
        default: 900

permissions:
  contents: read

jobs:
  delegate-to-colab-on-demand:
    uses: ./.github/workflows/colab_on_demand.yml
    with:
      task_code: ${{ inputs.python_code }}
      script_path: ""
      accelerator: "none"
      timeout_seconds: ${{ inputs.timeout_seconds }}
    secrets: inherit
