name: Verify alternate MP4 donor speaker against Achird master

on:
  push:
    branches: [automation/arabic-dub-colab-recovery-20261101]
    paths:
      - ".github/workflows/arabic-dub-speaker-donor-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-speaker:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colab CLI
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip google-colab-cli
          colab version

      - name: Configure Colab credentials locally only
        env:
          COLAB_CREDENTIALS: ${{ secrets.COLAB_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/gcloud" output
          if [ -z "${COLAB_CREDENTIALS:-}" ]; then echo "::error::COLAB_CREDENTIALS missing"; exit 1; fi
          python - <<'PY'
          import json,os,pathlib
          obj=json.loads(os.environ["COLAB_CREDENTIALS"])
          if obj.get("type") not in {"authorized_user","service_account","external_account","impersonated_service_account"}: raise SystemExit("Unsupported Colab credential type")
          p=pathlib.Path.home()/".config/gcloud/application_default_credentials.json"
          p.write_text(os.environ["COLAB_CREDENTIALS"],encoding="utf-8");p.chmod(0o600)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:f.write(f"GOOGLE_APPLICATION_CREDENTIALS={p}\n")
          print("Local CLI credentials configured; secret contents withheld.")
          PY

      - name: Allocate standard Colab T4
        run: |
          set -euo pipefail
          SESSION="arabic-dub-speaker-check-${GITHUB_RUN_ID}"
          echo "SESSION=$SESSION" >> "$GITHUB_ENV"
          colab --auth=adc new -s "$SESSION" --gpu T4 2>&1 | tee output/session.log
          colab --auth=adc status -s "$SESSION" 2>&1 | tee output/runtime.txt
          grep -Eqi 'Hardware: T4|gpu-t4' output/runtime.txt

      - name: Prepare and run speaker identity verification
        timeout-minutes: 120
        run: |
          set -euo pipefail
          mkdir -p output
          cat > output/verify_donor_speaker.py <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          ROOT=Path("/content/arabic_dub_speaker_check");ROOT.mkdir(parents=True,exist_ok=True)
          MP4=ROOT/"alternate.mp4"; WAV=ROOT/"achird.wav"
          def run(cmd):
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=1800)
              if p.returncode: raise RuntimeError(p.stdout[-4000:])
              return p.stdout
          import torch
          if not torch.cuda.is_available() or "T4" not in torch.cuda.get_device_name(0).upper(): raise RuntimeError("Expected standard T4")
          print("GPU="+torch.cuda.get_device_name(0),flush=True)
          subprocess.run([sys.executable,"-m","pip","install","-q","gdown","resemblyzer","soundfile","librosa"],check=True)
          import gdown, numpy as np, soundfile as sf
          if not MP4.is_file() or MP4.stat().st_size!=920467672:
              print("DOWNLOAD_MP4_BEGIN",flush=True)
              got=gdown.download(id="1TjyE6CuhxxU0iGZDOE3x3S_mnxmiEqlX",output=str(MP4),quiet=False,resume=True)
              if not got or not MP4.is_file() or MP4.stat().st_size!=920467672: raise RuntimeError("Alternate MP4 download failed size verification")
          if not WAV.is_file() or WAV.stat().st_size!=14792144:
              print("DOWNLOAD_ACHIRD_WAV_BEGIN",flush=True)
              got=gdown.download(id="1n-E4VaPurnlbvaT5V_5taMXNHaGC8Ipl",output=str(WAV),quiet=False,resume=True)
              if not got or not WAV.is_file() or WAV.stat().st_size!=14792144: raise RuntimeError("Achird master download failed size verification")
          print("DOWNLOADS_VERIFIED",flush=True)
          # Extract candidate Cartier Garden speech and reference utterances from Achird's own voice master.
          clips={
              "candidate_cartier_108s":(MP4,108.31,112.01),
              "candidate_context_108s":(MP4,102.31,115.51),
              "reference_chased_achird":(WAV,39.0,43.2),
              "reference_blacklist_achird":(WAV,142.7,155.8),
              "candidate_cartier_repeat_2188s":(MP4,2188.0,2192.0)
          }
          extracted={}
          for name,(src,start,end) in clips.items():
              out=ROOT/(name+".wav")
              run(["ffmpeg","-y","-hide_banner","-loglevel","error","-ss",str(start),"-i",str(src),"-t",str(end-start),"-vn","-ac","1","-ar","16000","-c:a","pcm_s16le",str(out)])
              arr,sr=sf.read(str(out),dtype="float32")
              extracted[name]=arr
              print("EXTRACTED",name,"samples",len(arr),"duration",round(len(arr)/sr,3),flush=True)
          from resemblyzer import VoiceEncoder, preprocess_wav
          encoder=VoiceEncoder("cpu")
          embeddings={}
          for name,arr in extracted.items():
              # The comparison model needs reasonably long speech segments.
              wav=preprocess_wav(arr,source_sr=16000)
              emb=encoder.embed_utterance(wav)
              embeddings[name]=emb
          def cosine(a,b): return float(np.dot(a,b)/(np.linalg.norm(a)*np.linalg.norm(b)+1e-12))
          refs=[embeddings["reference_chased_achird"],embeddings["reference_blacklist_achird"]]
          avg=(refs[0]+refs[1])/2
          report={
              "status":"speaker_similarity_probe_complete",
              "candidate_vs_chased_cosine":cosine(embeddings["candidate_cartier_108s"],refs[0]),
              "candidate_vs_blacklist_cosine":cosine(embeddings["candidate_cartier_108s"],refs[1]),
              "candidate_vs_achird_centroid_cosine":cosine(embeddings["candidate_cartier_108s"],avg),
              "repeat_vs_achird_centroid_cosine":cosine(embeddings["candidate_cartier_repeat_2188s"],avg),
              "reference_pair_cosine":cosine(refs[0],refs[1]),
              "note":"Cosine similarity is a screening measure, not proof of identity. No donor audio was inserted into the episode."
          }
          (ROOT/"speaker_report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("SPEAKER_REPORT="+json.dumps(report),flush=True)
          PY
          colab --auth=adc upload -s "$SESSION" output/verify_donor_speaker.py /content/verify_donor_speaker.py
          colab --auth=adc exec -s "$SESSION" --timeout 7200 -f output/verify_donor_speaker.py 2>&1 | tee output/speaker_check.log

      - name: Retrieve speaker comparison report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p output/return
          colab --auth=adc download -s "$SESSION" /content/arabic_dub_speaker_check/speaker_report.json output/return/speaker_report.json || true
          colab --auth=adc status -s "$SESSION" >> output/session.log 2>&1 || true

      - name: Require a completed speaker comparison report
        if: always()
        run: |
          test -s output/return/speaker_report.json
          python -m json.tool output/return/speaker_report.json >/dev/null

      - name: Stop Colab T4
        if: always()
        continue-on-error: true
        run: colab --auth=adc stop -s "$SESSION" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arabic-dub-speaker-check-${{ github.run_id }}
          path: output/**
          if-no-files-found: warn
          retention-days: 7
