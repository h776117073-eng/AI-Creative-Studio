name: Repair Pass 2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply render consistency fixes
        shell: python
        run: |
          from pathlib import Path
          def edit(path, fn):
            p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s); p.write_text(n,encoding='utf-8'); print(path, 'changed' if n!=s else 'unchanged')
          def repl(path, old, new):
            def f(s): return s.replace(old,new,1) if old in s else s
            edit(path,f)

          # AI speed range must match timeline semantics.
          repl('apps/api/src/aiRoute.ts','const atempo=(speed:number)=>{let x=Math.max(.25,Math.min(4,speed));','const atempo=(speed:number)=>{let x=Math.max(.1,Math.min(100,speed));')
          repl('apps/api/src/aiRoute.ts','const speed=Math.max(.25,Math.min(4,Number(clip.speed||1)));','const speed=Math.max(.1,Math.min(100,Number(clip.speed||1)));')
          repl('apps/api/src/aiRoute.ts',"else if(command.type==='set_speed')target.speed=Math.max(.25,Math.min(4,Number(command.value??1)));","else if(command.type==='set_speed')target.speed=Math.max(.1,Math.min(100,Number(command.value??1)));" )

          # Non-blocking FFmpeg process runner for API/AI routes.
          helper="""\nfunction runFFmpeg(args:string[], timeoutMs=180000):Promise<void>{\n  return new Promise((resolve,reject)=>{\n    const child=spawn('ffmpeg',args,{stdio:['ignore','ignore','pipe']});\n    let stderr='';\n    const timer=setTimeout(()=>{child.kill('SIGKILL');reject(new Error(`FFmpeg timed out after ${timeoutMs}ms\\n${stderr.slice(-4000)}`));},timeoutMs);\n    child.stderr.on('data',d=>{stderr+=String(d);if(stderr.length>12000)stderr=stderr.slice(-12000);});\n    child.once('error',error=>{clearTimeout(timer);reject(error);});\n    child.once('close',code=>{clearTimeout(timer);if(code===0)resolve();else reject(new Error(`FFmpeg exited with code ${code}\\n${stderr.slice(-4000)}`));});\n  });\n}\n"""
          for path in ('apps/api/src/server.ts','apps/api/src/aiRoute.ts'):
            edit(path, lambda s, helper=helper: s if 'function runFFmpeg(args:string[]' in s else s.replace("import { execFileSync, spawnSync } from 'node:child_process';","import { execFileSync, spawn } from 'node:child_process';",1).replace(("const hasAudio=(path:string)=>{try{return execFileSync('ffprobe'" if path.endswith('aiRoute.ts') else "function hasAudio(path:string){try{return execFileSync('ffprobe'"), ("const hasAudio=(path:string)=>{try{return execFileSync('ffprobe'" if path.endswith('aiRoute.ts') else "function hasAudio(path:string){try{return execFileSync('ffprobe'"),1)) + helper)

          # Convert render handlers to async execution where spawnSync is still present.
          repl('apps/api/src/server.ts',"import { execFileSync, spawnSync } from 'node:child_process';","import { execFileSync, spawn } from 'node:child_process';")
          repl('apps/api/src/aiRoute.ts',"import { execFileSync, spawnSync } from 'node:child_process';","import { execFileSync, spawn } from 'node:child_process';")
          edit('apps/api/src/server.ts', lambda s: s.replace("app.post('/api/projects/:id/render',(req,res)=>{","app.post('/api/projects/:id/render',async(req,res)=>{") if "app.post('/api/projects/:id/render',(req,res)=>{" in s else s)
          edit('apps/api/src/aiRoute.ts', lambda s: s.replace("const output=join(EXPORTS,`${randomUUID()}.mp4`);const result=spawnSync('ffmpeg'","const output=join(EXPORTS,`${randomUUID()}.mp4`);const result=spawnSync('ffmpeg'",1))

          # Keep output dimensions configurable but bounded.
          edit('apps/api/src/server.ts', lambda s: s.replace("const output=join(EXPORTS,`${randomUUID()}.mp4`);const args=", "const requestedWidth=Math.max(256,Math.min(3840,Number(req.body?.width||1280)));const requestedHeight=Math.max(144,Math.min(2160,Number(req.body?.height||720)));filter=filter.replaceAll('scale=1280:720','scale='+requestedWidth+':'+requestedHeight).replaceAll('pad=1280:720','pad='+requestedWidth+':'+requestedHeight);const output=join(EXPORTS,`${randomUUID()}.mp4`);const args=",1) if "const requestedWidth=" not in s else s)
          edit('apps/api/src/aiRoute.ts', lambda s: s.replace("const output=join(EXPORTS,`${randomUUID()}.mp4`);try{await runFFmpeg", "const requestedWidth=Math.max(256,Math.min(3840,Number(req.body?.width||1280)));const requestedHeight=Math.max(144,Math.min(2160,Number(req.body?.height||720)));filter=filter.replaceAll('scale=1280:720','scale='+requestedWidth+':'+requestedHeight).replaceAll('pad=1280:720','pad='+requestedWidth+':'+requestedHeight);const output=join(EXPORTS,`${randomUUID()}.mp4`);try{await runFFmpeg",1) if "const requestedWidth=" not in s else s)
          print('pass2 source patch completed')
      - name: Validate
        shell: bash
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run test:api
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.ts apps/api/src/aiRoute.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(render): align async renderer and export dimensions"
          git push
