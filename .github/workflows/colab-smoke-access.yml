name: Colab authorization and file-transfer smoke test

on:
  push:
    branches: [main]
    paths:
      - "scripts/colab_smoke_access.py"
      - ".github/workflows/colab-smoke-access.yml"

permissions:
  contents: read

concurrency:
  group: colab-smoke-access
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colab CLI and HTTP client
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade google-colab-cli requests

      - name: Configure ADC securely
        env:
          COLAB_CREDENTIALS: ${{ secrets.COLAB_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/gcloud" output
          if [ -z "${COLAB_CREDENTIALS:-}" ]; then
            echo "::error::COLAB_CREDENTIALS is missing."
            exit 1
          fi
          python - <<'PY'
          import json, os, pathlib
          raw = os.environ["COLAB_CREDENTIALS"]
          data = json.loads(raw)
          if data.get("type") not in {"authorized_user", "service_account", "external_account", "impersonated_service_account"}:
              raise SystemExit("Unsupported ADC type; secret contents were not printed.")
          path = pathlib.Path.home()/".config/gcloud/application_default_credentials.json"
          path.write_text(raw, encoding="utf-8")
          path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"GOOGLE_APPLICATION_CREDENTIALS={path}\n")
          print("ADC file validated; secret contents not printed.")
          PY

      - name: Allocate High-RAM Colab and execute a small task
        run: |
          set -euo pipefail
          SESSION="dubbing-smoke-test"
          mkdir -p output
          cleanup() { colab --auth=adc stop -s "$SESSION" >> output/smoke.log 2>&1 || true; }
          trap cleanup EXIT
          colab --auth=adc stop -s "$SESSION" >/dev/null 2>&1 || true
          COLAB_CLI_ASSIGN_RETRIES=2 COLAB_CLI_RETRY_BACKOFF=10 colab --auth=adc new -s "$SESSION" 2>&1 | tee -a output/smoke.log
          colab --auth=adc status -s "$SESSION" 2>&1 | tee -a output/smoke.log
          colab --auth=adc exec -s "$SESSION" --timeout 180 -f scripts/colab_smoke_access.py 2>&1 | tee -a output/smoke.log

          python - <<'PY'
          import requests
          from colab_cli.common import state
          s = state.get_session("dubbing-smoke-test")
          params = {"authuser": "0", "colab-runtime-proxy-token": s.token}
          candidates = [
              ("raw_files_route", s.url.rstrip("/") + "/files/dub_smoke.txt", {}),
              ("contents_download_route", s.url.rstrip("/") + "/api/contents/content/dub_smoke.txt", {"download": "1"}),
              ("contents_json_route", s.url.rstrip("/") + "/api/contents/content/dub_smoke.txt", {"content": "1"}),
          ]
          success = False
          for label, url, extra in candidates:
              try:
                  response = requests.get(url, params={**params, **extra}, timeout=30)
                  print(f"{label}: status={response.status_code}; content_type={response.headers.get('Content-Type')}; bytes={len(response.content)}")
                  if response.status_code == 200 and b"COLAB_FILE_STREAM_TEST_OK" in response.content:
                      if "json" not in response.headers.get("Content-Type", "").lower():
                          print(f"{label}=RAW_BINARY_PASS")
                          success = True
                      else:
                          try:
                              data = response.json()
                              if data.get("content") == "COLAB_FILE_STREAM_TEST_OK\n":
                                  print(f"{label}=JSON_BASE64_PASS")
                                  success = True
                          except Exception:
                              pass
              except requests.RequestException as exc:
                  print(f"{label}: error={type(exc).__name__}")
          if not success:
              raise SystemExit("No Colab file-transfer endpoint passed.")
          PY

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colab-smoke-${{ github.run_id }}
          path: output/smoke.log
          if-no-files-found: warn
          retention-days: 3
