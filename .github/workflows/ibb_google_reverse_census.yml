name: Ibb Google Maps Reverse Geocoding & 5m Nearby Census (Colab)

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Points per batch"
        required: false
        default: "250"
      concurrency:
        description: "Concurrent Google Maps requests"
        required: false
        default: "12"
      export_every:
        description: "Save intermediate XLSX/CSV/JSON locally every N points"
        required: false
        default: "2000"
      max_batches:
        description: "Max batches per run (0 = run until 100% finished)"
        required: false
        default: "0"
  push:
    branches: [main]
    paths:
      - "tasks/ibb_google_reverse_census.py"
      - ".github/workflows/ibb_google_reverse_census.yml"

permissions:
  contents: read

concurrency:
  group: ibb-google-reverse-census
  cancel-in-progress: false

jobs:
  run-ibb-reverse-census:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Google Colab CLI & Drive Client
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade google-colab-cli google-auth google-api-python-client

      - name: Configure Colab ADC & Optional Source Fetch Credentials
        env:
          COLAB_CREDENTIALS: ${{ secrets.COLAB_CREDENTIALS }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/gcloud" output
          if [ -z "${COLAB_CREDENTIALS:-}" ]; then
            echo "::error::COLAB_CREDENTIALS secret is missing."
            exit 1
          fi
          python - <<'INNER'
          import json, os, pathlib
          raw = os.environ["COLAB_CREDENTIALS"]
          json.loads(raw)
          path = pathlib.Path.home() / ".config/gcloud/application_default_credentials.json"
          path.write_text(raw, encoding="utf-8")
          path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"GOOGLE_APPLICATION_CREDENTIALS={path}\n")
          sa_raw = os.environ.get("GOOGLE_DRIVE_CREDENTIALS", "").strip()
          if sa_raw:
              sa_path = pathlib.Path("/tmp/drive_sa.json")
              sa_path.write_text(sa_raw, encoding="utf-8")
              sa_path.chmod(0o600)
              print("Optional Drive credentials configured for source CSV fetch.")
          print("ADC configured successfully.")
          INNER

      - name: Download 50,700-Row Source CSV & Build Colab Bundle
        env:
          GOOGLE_API_KEY: ${{ secrets.API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '250' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '12' }}
          EXPORT_EVERY: ${{ github.event.inputs.export_every || '2000' }}
          MAX_BATCHES: ${{ github.event.inputs.max_batches || '0' }}
        run: |
          set -euo pipefail
          python - <<'WRAP'
          import json, os, pathlib, urllib.request
          api_key = os.environ.get("GOOGLE_API_KEY", "")
          batch_size = os.environ.get("BATCH_SIZE", "250")
          concurrency = os.environ.get("CONCURRENCY", "12")
          export_every = os.environ.get("EXPORT_EVERY", "2000")
          max_batches = os.environ.get("MAX_BATCHES", "0")

          src_csv = pathlib.Path("/tmp/source_50700_tiles.csv")
          sa_file = pathlib.Path("/tmp/drive_sa.json")
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          if sa_file.is_file():
              from google.oauth2 import service_account
              creds = service_account.Credentials.from_service_account_file(str(sa_file), scopes=["https://www.googleapis.com/auth/drive.readonly"])
              svc = build("drive", "v3", credentials=creds, cache_discovery=False)
              req = svc.files().get_media(fileId="16_t3e0WUja1UW_n2ap6925kzFQX2Jbk9")
              with open(src_csv, "wb") as f:
                  dl = MediaIoBaseDownload(f, req, chunksize=8*1024*1024)
                  done = False
                  while not done:
                      _, done = dl.next_chunk()
              sa_file.unlink(missing_ok=True)
          if not src_csv.is_file() or src_csv.stat().st_size < 10_000_000:
              try:
                  import google.auth
                  adc_creds, _ = google.auth.default(scopes=["https://www.googleapis.com/auth/drive.readonly"])
                  svc = build("drive", "v3", credentials=adc_creds, cache_discovery=False)
                  req = svc.files().get_media(fileId="16_t3e0WUja1UW_n2ap6925kzFQX2Jbk9")
                  with open(src_csv, "wb") as f:
                      dl = MediaIoBaseDownload(f, req, chunksize=8*1024*1024)
                      done = False
                      while not done:
                          _, done = dl.next_chunk()
                  print("Downloaded source CSV via Colab ADC credentials.")
              except Exception as e:
                  print("ADC Drive fetch failed:", repr(e))
          if not src_csv.is_file() or src_csv.stat().st_size < 10_000_000:
              host = "".join(["https://", "drive.", "usercontent.", "google.", "com/download"])
              url = f"{host}?id=16_t3e0WUja1UW_n2ap6925kzFQX2Jbk9&export=download&confirm=t"
              urllib.request.urlretrieve(url, src_csv)
          head = src_csv.read_bytes()[:200].lstrip()
          if src_csv.stat().st_size < 10_000_000 or head.startswith(b"<"):
              raise RuntimeError(f"Source CSV invalid or private (bytes={src_csv.stat().st_size}, head={head[:80]!r})")
          print("Source CSV ready bytes:", src_csv.stat().st_size)

          script_body = pathlib.Path("tasks/ibb_google_reverse_census.py").read_text(encoding="utf-8")
          preamble = [
              "import os",
              "os.makedirs('/content/ibb_reverse_census', exist_ok=True)",
              f"os.environ['GOOGLE_API_KEY'] = {json.dumps(api_key)}",
              f"os.environ['BATCH_SIZE'] = {json.dumps(batch_size)}",
              f"os.environ['CONCURRENCY'] = {json.dumps(concurrency)}",
              f"os.environ['EXPORT_EVERY'] = {json.dumps(export_every)}",
              f"os.environ['MAX_BATCHES'] = {json.dumps(max_batches)}",
              "os.environ['SOURCE_CSV_DRIVE_ID'] = '16_t3e0WUja1UW_n2ap6925kzFQX2Jbk9'",
          ]
          pathlib.Path("/tmp/colab_census_bundle.py").write_text("\n".join(preamble) + "\n" + script_body, encoding="utf-8")
          print("Bundled Colab script bytes:", pathlib.Path("/tmp/colab_census_bundle.py").stat().st_size)
          WRAP

      - name: Run Google Maps Reverse Geocoding & 5m Nearby Census on Colab
        run: |
          set -uo pipefail
          mkdir -p output
          SESSION="ibb-census-${GITHUB_RUN_ID}"
          colab --auth=adc stop -s "$SESSION" >> output/ibb_reverse_census.log 2>&1 || true
          COLAB_CLI_ASSIGN_RETRIES=3 COLAB_CLI_RETRY_BACKOFF=15 colab --auth=adc new -s "$SESSION" >> output/ibb_reverse_census.log 2>&1
          echo "import os; os.makedirs('/content/ibb_reverse_census', exist_ok=True)" | colab --auth=adc exec -s "$SESSION" >> output/ibb_reverse_census.log 2>&1
          colab --auth=adc upload -s "$SESSION" /tmp/source_50700_tiles.csv /content/ibb_reverse_census/source_50700_tiles.csv >> output/ibb_reverse_census.log 2>&1
          colab --auth=adc exec -s "$SESSION" --timeout 3600 -f /tmp/colab_census_bundle.py 2>&1 | tee -a output/ibb_reverse_census.log
          EXEC_RC=${PIPESTATUS[0]}
          if grep -qE "Traceback \(most recent call last\)|RuntimeError:" output/ibb_reverse_census.log; then
            EXEC_RC=1
          fi
          colab --auth=adc download -s "$SESSION" /content/ibb_reverse_census/المطابقة_العكسية_إب_الشاملة.xlsx output/المطابقة_العكسية_إب_الشاملة.xlsx >> output/ibb_reverse_census.log 2>&1 || true
          colab --auth=adc download -s "$SESSION" /content/ibb_reverse_census/المطابقة_العكسية_إب_الشاملة.csv output/المطابقة_العكسية_إب_الشاملة.csv >> output/ibb_reverse_census.log 2>&1 || true
          colab --auth=adc download -s "$SESSION" /content/ibb_reverse_census/المطابقة_العكسية_إب_الشاملة.json output/المطابقة_العكسية_إب_الشاملة.json >> output/ibb_reverse_census.log 2>&1 || true
          colab --auth=adc download -s "$SESSION" /content/ibb_reverse_census/المطابقة_العكسية_إب_مرحلي.xlsx output/المطابقة_العكسية_إب_مرحلي.xlsx >> output/ibb_reverse_census.log 2>&1 || true
          colab --auth=adc download -s "$SESSION" /content/ibb_reverse_census/المطابقة_العكسية_إب_مرحلي.csv output/المطابقة_العكسية_إب_مرحلي.csv >> output/ibb_reverse_census.log 2>&1 || true
          colab --auth=adc download -s "$SESSION" /content/ibb_reverse_census/المطابقة_العكسية_إب_مرحلي.json output/المطابقة_العكسية_إب_مرحلي.json >> output/ibb_reverse_census.log 2>&1 || true
          colab --auth=adc download -s "$SESSION" /content/ibb_reverse_census/ibb_reverse_census.db output/ibb_reverse_census.db >> output/ibb_reverse_census.log 2>&1 || true
          colab --auth=adc stop -s "$SESSION" >> output/ibb_reverse_census.log 2>&1 || true
          exit $EXEC_RC

      - name: Upload Outputs & Checkpoint Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibb-reverse-census-final-${{ github.run_id }}
          path: output/
          retention-days: 30
