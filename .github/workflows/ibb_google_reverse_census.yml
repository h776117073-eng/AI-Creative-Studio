name: Ibb Google Maps Reverse Geocoding & 5m Nearby Census (Colab)

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Points per batch"
        required: false
        default: "250"
      concurrency:
        description: "Concurrent Google Maps requests"
        required: false
        default: "12"
      export_every:
        description: "Sync intermediate XLSX/CSV/JSON to Drive every N points"
        required: false
        default: "2000"
      max_batches:
        description: "Max batches per run (0 = run until 100% finished)"
        required: false
        default: "0"
  push:
    branches: [main]
    paths:
      - "tasks/ibb_google_reverse_census.py"
      - ".github/workflows/ibb_google_reverse_census.yml"

permissions:
  contents: read

concurrency:
  group: ibb-google-reverse-census
  cancel-in-progress: false

jobs:
  run-ibb-reverse-census:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Google Colab CLI
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade google-colab-cli google-auth google-api-python-client

      - name: Configure Google ADC Credentials
        env:
          COLAB_CREDENTIALS: ${{ secrets.COLAB_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/gcloud" output
          if [ -z "${COLAB_CREDENTIALS:-}" ]; then
            echo "::error::COLAB_CREDENTIALS secret is missing."
            exit 1
          fi
          python - <<'INNER'
          import json, os, pathlib
          raw = os.environ["COLAB_CREDENTIALS"]
          json.loads(raw)
          path = pathlib.Path.home() / ".config/gcloud/application_default_credentials.json"
          path.write_text(raw, encoding="utf-8")
          path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"GOOGLE_APPLICATION_CREDENTIALS={path}\n")
          print("ADC configured successfully.")
          INNER

      - name: Build Colab Task Bundle
        env:
          GOOGLE_API_KEY: ${{ secrets.API_KEY }}
          COLAB_CREDENTIALS: ${{ secrets.COLAB_CREDENTIALS }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '250' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '12' }}
          EXPORT_EVERY: ${{ github.event.inputs.export_every || '2000' }}
          MAX_BATCHES: ${{ github.event.inputs.max_batches || '0' }}
        run: |
          set -euo pipefail
          python - <<'WRAP'
          import base64, json, os, pathlib
          adc_b64 = base64.b64encode(os.environ["COLAB_CREDENTIALS"].encode("utf-8")).decode("ascii")
          api_key = os.environ.get("GOOGLE_API_KEY", "")
          batch_size = os.environ.get("BATCH_SIZE", "250")
          concurrency = os.environ.get("CONCURRENCY", "12")
          export_every = os.environ.get("EXPORT_EVERY", "2000")
          max_batches = os.environ.get("MAX_BATCHES", "0")
          script_body = pathlib.Path("tasks/ibb_google_reverse_census.py").read_text(encoding="utf-8")
          preamble = "\n".join([
              "import base64, os, pathlib",
              "os.makedirs('/content/ibb_reverse_census', exist_ok=True)",
              "cred_path = pathlib.Path('/content/adc_creds.json')",
              f"cred_path.write_bytes(base64.b64decode({json.dumps(adc_b64)}))",
              "os.environ['GOOGLE_APPLICATION_CREDENTIALS'] = str(cred_path)",
              f"os.environ['GOOGLE_API_KEY'] = {json.dumps(api_key)}",
              f"os.environ['BATCH_SIZE'] = {json.dumps(batch_size)}",
              f"os.environ['CONCURRENCY'] = {json.dumps(concurrency)}",
              f"os.environ['EXPORT_EVERY'] = {json.dumps(export_every)}",
              f"os.environ['MAX_BATCHES'] = {json.dumps(max_batches)}",
              "os.environ['TARGET_DRIVE_FOLDER_ID'] = '171LM8hjZGooZfYWV6Z0mX8vlLWfYzX7A'",
              "os.environ['SOURCE_CSV_DRIVE_ID'] = '16_t3e0WUja1UW_n2ap6925kzFQX2Jbk9'",
          ])
          pathlib.Path("/tmp/colab_census_bundle.py").write_text(preamble + "\n" + script_body, encoding="utf-8")
          print("Bundled Colab script bytes:", pathlib.Path("/tmp/colab_census_bundle.py").stat().st_size)
          WRAP

      - name: Run Google Maps Reverse Geocoding & 5m Nearby Census on Colab
        run: |
          set -uo pipefail
          mkdir -p output
          colab --auth=adc run --timeout 3600 /tmp/colab_census_bundle.py 2>&1 | tee output/ibb_reverse_census.log

      - name: Upload Execution Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibb-reverse-census-logs-${{ github.run_id }}
          path: output/
          retention-days: 14
