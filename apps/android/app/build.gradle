plugins { id 'com.android.application' }

android { namespace 'com.aicreativestudio.mobile'; compileSdk 35
    defaultConfig { applicationId 'com.aicreativestudio.mobile'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro' } }
}

dependencies { implementation 'androidx.appcompat:appcompat:1.7.0'; implementation 'androidx.webkit:webkit:1.13.0'; }
